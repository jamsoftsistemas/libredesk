          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Erro ao remover contato
  /chat/details:
    post:
      operationId: getChatDetails
      tags:
        - Contatos
      summary: Consultar detalhes de um chat
      description: |
        Retorna os dados disponíveis para apresentar ou editar uma conversa:
        identificação, nomes conhecidos, telefone, foto, estado do chat, dados de
        lead e informações de grupo quando aplicáveis.

        Use depois de escolher um chat em `POST /chat/find`. Para obter somente a
        imagem, prefira `POST /chat/avatar`, mais leve, principalmente em listas com
        muitos chats. O campo `preview` permite escolher uma imagem menor para
        interfaces de listagem ou a imagem completa.

        Cada instância processa até 4 consultas desta rota ao mesmo tempo. A
        seguinte espera até 2 segundos por uma vaga; se não houver, recebe `429`
        com o header `Retry-After`. A rota também conta no limite de chamadas da
        instância.

        Para contatos individuais, `is_business` indica se há um nome comercial
        conhecido. `business_name` traz esse nome quando disponível.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: Número do telefone ou ID do grupo
                  example: '5511999999999'
                preview:
                  type: boolean
                  description: |
                    Controla o tamanho da imagem de perfil retornada:
                    - `true`: Retorna imagem em tamanho preview (menor, otimizada para listagens)
                    - `false` (padrão): Retorna imagem em tamanho full (resolução original, maior qualidade)
                  default: false
              required:
                - number
      responses:
        '200':
          description: Informações completas do chat retornadas com sucesso
          content:
