        A atualização chega no objeto `chat`. O campo `chat.wa_label` representa a associação resultante; normalize a
        representação recebida antes de aplicar. Uma lista vazia significa que as etiquetas foram removidas.


        Não confunda este evento com `labels`, que altera a definição da etiqueta. Em sincronizações, associações também
        podem chegar em `history` com `event: chat_labels` e metadados de chunks.
