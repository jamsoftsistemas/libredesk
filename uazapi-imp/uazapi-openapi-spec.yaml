  sender:
    post:
      summary: Processamento de campanhas
      description: >-
        Acompanhe início e conclusão do processamento de uma pasta de campanha.


        ## Estados e contadores


        | `status` | Conteúdo principal |

        |---|---|

        | `sending` | `folderID`, `folderInfo`, `messageCount`, `scheduledFor`, `startedAt` |

        | `done` | `folderID`, `folderInfo`, `successCount`, `failedCount`, `completedAt` |


        Correlacione pelo `folderID` dentro da instância. Os timestamps de início/conclusão usam milissegundos Unix. O
        término do processamento e os contadores da campanha não equivalem à leitura de todas as mensagens pelos
        destinatários; para isso, acompanhe os eventos de mensagens correspondentes.


        A notificação de início ocorre na transição de scheduled para sending; não espere um novo evento de início a
        cada retomada interna.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: sender
                      description: Nome exato para inscrição e identificação deste evento.
                    folderID:
                      type: string
                      description: ID da pasta de campanha.
                    folderInfo:
                      type: string
                      description: Informação descritiva da pasta.
                    status:
                      type: string
                      enum:
                        - sending
                        - done
                      description: Fase notificada do processamento.
                    messageCount:
                      type: integer
                      description: Quantidade no início do processamento.
                    scheduledFor:
                      type: integer
                      description: Agendamento informado pela pasta.
                    startedAt:
                      type: integer
                      description: Início em milissegundos Unix.
                    successCount:
                      type: integer
                      description: Contagem de sucesso registrada pelo processamento.
                    failedCount:
                      type: integer
                      description: Contagem de falhas registrada pelo processamento.
                    completedAt:
                      type: integer
                      description: Conclusão em milissegundos Unix.
                  additionalProperties: true
            examples:
              sending:
                summary: Início de processamento
                value:
                  EventType: sender
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  folderID: r0123456789abcd
                  folderInfo: Campanha de exemplo
                  status: sending
                  messageCount: 20
                  scheduledFor: 1788868800000
                  startedAt: 1788868800000
              done:
                summary: Processamento concluído
                value:
                  EventType: sender
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  folderID: r0123456789abcd
                  folderInfo: Campanha de exemplo
                  status: done
                  successCount: 19
                  failedCount: 1
                  completedAt: 1788868860000
      responses:
        '200':
          description: >-
            Seu receptor aceitou o evento. A resposta deve ser rápida; processe trabalho demorado depois de persistir o
            recebimento.
