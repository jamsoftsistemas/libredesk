                  timed_out:
                    type: boolean
                    description: 'Só no modo síncrono: o prazo de `timeoutMs` acabou.'
                  partial:
                    type: boolean
                    description: 'Só no modo síncrono: ainda pode haver mais mensagens (`has_more` diferente de `false`).'
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: 'Só no modo síncrono: mensagens do pedido, no formato do evento `history`.'
              examples:
                async_padrão:
                  summary: Solicitação de histórico enviada
