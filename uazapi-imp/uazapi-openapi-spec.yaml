  /sse:
    get:
      operationId: subscribeSSE
      tags:
        - Webhooks e SSE
      summary: Server-Sent Events (SSE)
      description: |-
        Receber eventos em tempo real via Server-Sent Events (SSE)

        ### Funcionalidades principais:
        - conexão HTTP persistente em `text/event-stream`
        - seleção granular de tipos de eventos
        - filtragem de tipos de mensagens
        - autenticação por token na query, compatível com `EventSource`

        **Eventos Disponíveis**:
        - `connection`: Alterações no estado da conexão
        - `history`: Recebimento de histórico de mensagens
        - `messages`: Novas mensagens recebidas
        - `messages_update`: Atualizações em mensagens existentes
        - `call`: Eventos de chamadas VoIP
        - `contacts`: Atualizações na agenda de contatos
        - `presence`: Alterações no status de presença
        - `groups`: Modificações em grupos
        - `labels`: Gerenciamento de etiquetas
        - `chats`: Eventos de conversas
        - `chat_labels`: Alterações em etiquetas de conversas


        Estabelece uma conexão persistente para receber eventos em tempo real. Este
        endpoint:

        1. Requer autenticação via token

        2. Mantém uma conexão HTTP aberta com o cliente

        3. Envia eventos conforme ocorrem no servidor

        4. Suporta diferentes tipos de eventos

        Exemplo de uso:

        ```javascript

        const eventSource = new
        EventSource('/sse?token=SEU_TOKEN&events=chats,messages');


        eventSource.onmessage = function(event) {
          const data = JSON.parse(event.data);
          console.log('Novo evento:', data);
        };


        eventSource.onerror = function(error) {
          console.error('Erro na conexão SSE:', error);
        };

        ```


        Estrutura de um evento:

        ```json

        {
          "type": "message",
          "data": {
            "id": "3EB0538DA65A59F6D8A251",
            "from": "5511999999999@s.whatsapp.net",
            "to": "5511888888888@s.whatsapp.net",
            "text": "Olá!",
            "timestamp": 1672531200000
          }
        }

        ```
      security: []
      parameters:
        - name: token
          in: query
          schema:
            type: string
          required: true
          description: Token de autenticação da instância
          example: '{{token}}'
        - name: events
          in: query
          schema:
            type: string
          required: true
          description: |
            Tipos de eventos a serem recebidos. Suporta dois formatos:
            - Separados por vírgula: `?events=chats,messages`
            - Parâmetros repetidos: `?events=chats&events=messages`
            `status_posts` e `newsletter_messages` só são entregues quando listados pelo nome.
          example: chats,messages
        - name: excludeMessages
          in: query
          schema:
            type: string
          required: false
          description: |
            Tipos de mensagens a serem excluídas do evento `messages`. Suporta dois formatos:
            - Separados por vírgula: `?excludeMessages=poll,reaction`
            - Parâmetros repetidos: `?excludeMessages=poll&excludeMessages=reaction`
          example: poll,reaction
      responses:
        '200':
          description: Stream de eventos aberto
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: messages
                data: {"type":"message","data":{"text":"Olá"}}
        '400':
          description: Lista de eventos ou parâmetros inválidos
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Unauthorized
  /sender/simple:
    post:
      operationId: sendSimpleCampaign
      tags:
        - Mensagem em massa
      summary: Criar nova campanha (Simples)
      description: >-
        Cria uma campanha para enviar a mesma mensagem a vários destinatários com intervalo controlado. Acompanhe a
        execução em `GET /sender/stats`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - numbers
                - type
                - delayMin
                - delayMax
                - scheduled_for
              properties:
                numbers:
                  type: array
                  description: Lista de números para envio
                  items:
                    type: string
                  example:
                    - 5511999999999@s.whatsapp.net
                type:
                  type: string
                  description: Tipo da mensagem
                  enum:
                    - text
                    - image
                    - video
                    - videoplay
                    - audio
                    - document
                    - contact
                    - location
                    - list
                    - button
                    - poll
                    - carousel
                folder:
                  type: string
                  description: Nome da campanha de envio
                  example: Campanha Janeiro
                delayMin:
                  type: integer
                  description: Delay mínimo entre mensagens em segundos
                  minimum: 1
                  example: 10
                delayMax:
                  type: integer
                  description: Delay máximo entre mensagens em segundos
                  minimum: 1
                  example: 30
                scheduled_for:
                  type: integer
                  description: Timestamp em milissegundos ou minutos a partir de agora para agendamento
                  example: 1706198400000
                info:
                  type: string
                  description: Informações adicionais sobre a campanha
                delay:
                  type: integer
                  description: Delay fixo entre mensagens (opcional)
                mentions:
                  type: string
                  description: Menções na mensagem em formato JSON
                text:
                  type: string
                  description: Texto da mensagem
                linkPreview:
                  type: boolean
                  description: >-
                    Habilitar preview de links em mensagens de texto. O preview será gerado automaticamente a partir da
                    URL contida no texto.
                linkPreviewTitle:
                  type: string
                  description: Título personalizado para o preview do link (opcional)
                linkPreviewDescription:
                  type: string
                  description: Descrição personalizada para o preview do link (opcional)
                linkPreviewImage:
                  type: string
                  description: URL ou dados base64 da imagem para o preview do link (opcional)
                linkPreviewLarge:
                  type: boolean
                  description: Se deve usar preview grande ou pequeno (opcional, padrão false)
                file:
                  type: string
                  description: URL da mídia ou arquivo (quando type é image, video, audio, document, etc.)
                docName:
                  type: string
                  description: Nome do arquivo (quando type é document)
                fullName:
                  type: string
                  description: Nome completo (quando type é contact)
                phoneNumber:
                  type: string
                  description: Número do telefone (quando type é contact)
                organization:
                  type: string
                  description: Organização (quando type é contact)
                email:
                  type: string
                  description: Email (quando type é contact)
                url:
                  type: string
                  description: URL (quando type é contact)
