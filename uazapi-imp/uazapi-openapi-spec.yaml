        O usuário visualiza o detalhe do recebedor, nome e chave.

        ## Regras principais
        - `pixType` aceita: `CPF`, `CNPJ`, `PHONE`, `EMAIL`, `EVP` (case insensitive)
        - `pixName` padrão: `"Pix"` quando não informado - nome de quem recebe o pagamento


        ## Campos comuns
        Este endpoint herda os campos opcionais padronizados da tag **"Enviar Mensagem"**:
        `delay`, `readchat`, `readmessages`, `replyid`, `mentions`, `track_source`, `track_id` e `async`.

        ## Exemplo de payload
        ```json
        {
          "number": "5511999999999",
          "pixType": "EVP",
          "pixKey": "123e4567-e89b-12d3-a456-426614174000",
          "pixName": "Loja Exemplo"
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: >-
                    ID do chat para o qual a mensagem será enviada. Pode ser um número de telefone em formato
                    internacional, um ID de grupo (`@g.us`), um ID de usuário (com `@s.whatsapp.net` ou `@lid`).
                  example: '5511999999999'
                pixType:
                  type: string
                  description: 'Tipo da chave PIX. Valores aceitos: CPF, CNPJ, PHONE, EMAIL ou EVP'
                  example: EVP
                pixKey:
                  type: string
                  description: Valor da chave PIX (CPF/CNPJ/telefone/email/EVP)
                  example: 123e4567-e89b-12d3-a456-426614174000
                pixName:
                  type: string
                  description: Nome exibido como recebedor do PIX (padrão "Pix" se vazio)
                  example: Loja Exemplo
                async:
                  type: boolean
                  description: Enfileira o envio para processamento assíncrono
                delay:
                  type: integer
                  description: Atraso em milissegundos antes do envio (exibe "digitando..." no WhatsApp)
                readchat:
                  type: boolean
                  description: Marca o chat como lido após enviar a mensagem
                readmessages:
                  type: boolean
                  description: Marca mensagens recentes como lidas após o envio
                replyid:
                  type: string
                  description: ID da mensagem que será respondida
                mentions:
                  type: string
                  description: Lista de números mencionados separados por vírgula
                track_source:
                  type: string
                  description: 'Origem de rastreamento (ex.: chatwoot, crm-interno)'
                track_id:
                  type: string
                  description: Identificador de rastreamento (aceita valores duplicados)
              required:
                - number
                - pixType
                - pixKey
              example:
                number: '5511999999999'
                pixType: EVP
                pixKey: 123e4567-e89b-12d3-a456-426614174000
                pixName: Loja Exemplo
      responses:
        '200':
          description: Botão PIX enviado com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      response:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
                          message:
                            type: string
                            example: PIX button sent successfully
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid keyType. Allowed: CPF, CNPJ, PHONE, EMAIL, EVP'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid token
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to send PIX button
  /message/async:
    get:
      operationId: getAsyncQueueStatus
      tags:
        - Mensagem Async
      summary: Consultar fila async de envio direto
      description: >
        Retorna um resumo simples da fila de envio `async=true` da instância atual autenticada.


        Este endpoint cobre apenas mensagens diretas enviadas com `async=true`. Ele **não** representa:

        - campanhas de envio em massa do sender (`/sender/*`)


        A resposta padrão foi pensada para clientes:

        - `status`: visão resumida da fila (`idle`, `queued`, `processing`, `waiting_connection`, `waiting_warmup`,
        `waiting_history`, `resetting`)

        - `pending`: quantidade total estimada de mensagens pendentes

        - `processingNow`: indica se uma mensagem está sendo processada neste momento

        - `acceptingNewMessages`: indica se a fila aceita novos envios async

        - `sessionReady`: indica se a sessão WhatsApp está pronta para envio

        - `resetting`: indica se a fila está pausada por reset/clear
      responses:
        '200':
          description: Resumo da fila async
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Async queue status
                  instanceId:
                    type: string
                    description: ID da instância
                  queue:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Estado resumido da fila
                        enum:
                          - idle
                          - queued
                          - processing
                          - waiting_connection
                          - waiting_warmup
                          - waiting_history
                          - resetting
                        example: waiting_connection
                      pending:
                        type: integer
                        format: int64
                        description: Quantidade total estimada de mensagens pendentes
                        example: 3
                      processingNow:
                        type: boolean
                        description: Indica se há uma mensagem sendo processada agora
                        example: true
                      acceptingNewMessages:
                        type: boolean
                        description: Indica se a fila aceita novos envios async
                        example: true
                      sessionReady:
                        type: boolean
                        description: Indica se a sessão WhatsApp está pronta para envio
                        example: false
                      historyReady:
                        type: boolean
                        description: Indica se o histórico necessário para processar a fila está pronto
                        example: true
                      warmupRemainingMs:
                        type: integer
                        format: int64
                        description: Tempo estimado restante da preparação da sessão, em milissegundos
                        example: 1500
                      resetting:
                        type: boolean
                        description: Indica se a fila async está pausada por reset/clear
                        example: false
        '401':
          description: Token inválido ou ausente
        '500':
          description: Erro interno ao consultar a fila async
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  instanceId:
                    type: string
    delete:
      operationId: clearAsyncQueue
      tags:
        - Mensagem Async
      summary: Limpar fila async de envio direto
      description: |
        Cancela toda a fila de envio `async=true` da instância e marca as mensagens pendentes como `Canceled`.

        Este endpoint atua apenas nos envios diretos com `async=true`. Ele **não** afeta:
        - campanhas do sender (`/sender/*`)
        - mensagens já enviadas com sucesso
        - mensagens em massa agendadas

        Use quando houver uma fila acumulada ou quando for necessário cancelar todos
        os envios assíncronos ainda não concluídos. Depois da limpeza, a instância
        volta a aceitar novos envios com `async=true`.
      responses:
        '200':
          description: Fila async limpa com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Async queue cleared
                  instanceId:
                    type: string
                    description: ID da instância
                  stats:
                    type: object
                    properties:
                      trackedJobsCleared:
                        type: integer
                        description: Quantidade de IDs rastreados removidos da fila em memória
                        example: 3
                      bufferedJobsMarkedCanceled:
                        type: integer
                        description: Jobs em memória marcados como `Canceled`
                        example: 2
                      drainedChannelJobs:
                        type: integer
                        description: Jobs removidos do canal principal da fila
                        example: 1
                      clearedOverflowJobs:
                        type: integer
                        description: Jobs removidos do backlog de overflow
                        example: 1
                      persistedQueuedCanceled:
                        type: integer
                        format: int64
                        description: Mensagens persistidas em `Queued` que foram atualizadas para `Canceled`
                        example: 5
        '401':
          description: Token inválido ou ausente
        '409':
          description: >-
            A fila não pôde ser limpa porque a instância está em reset ou havia envio em progresso que não drenou a
            tempo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: async queue did not drain before reset
                  instanceId:
                    type: string
                  stats:
                    type: object
                    additionalProperties: true
        '500':
          description: Erro interno ao limpar a fila async
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  instanceId:
                    type: string
                  stats:
                    type: object
                    additionalProperties: true
  /instance/updateDelaySettings:
    post:
      operationId: updateDelaySettings
      tags:
        - Mensagem Async
      summary: Configurar delay entre mensagens async
      description: |
        Configura o intervalo de tempo entre mensagens diretas enviadas com `async=true`.

        ### Detalhes
        - Configuração aplicada apenas à fila interna de mensagens async
        - Afeta mensagens enviadas pelos endpoints de envio com `async=true`
        - Não afeta campanhas do sender (`/sender/*`)
        - Delay mínimo (msg_delay_min): 0 ou mais segundos (0 = sem delay)
        - Delay máximo (msg_delay_max): se menor que min, será ajustado para o mesmo valor de min
        - Sistema ajusta automaticamente valores negativos para 0

        ### Exemplo
        ```json
        {
          "msg_delay_min": 0,
          "msg_delay_max": 2
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                msg_delay_min:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Delay mínimo em segundos (0 = sem delay)
                  example: 0
                msg_delay_max:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Delay máximo em segundos
                  example: 2
              required:
                - msg_delay_min
                - msg_delay_max
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    $ref: '#/components/schemas/Instance'
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid request payload
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: client not found
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to update delay settings
  /message/download:
    post:
      operationId: downloadMessage
      tags:
        - Ações na mensagem e Buscar
      summary: Baixar arquivo de uma mensagem
      description: >
        Baixa o arquivo associado a uma mensagem de mídia (imagem, vídeo, áudio, documento ou sticker).


        ## Parâmetros


        - **id** (string, obrigatório): ID da mensagem

        - **return_base64** (boolean, default: false): Inclui o arquivo em base64. Evite esta opção porque aumenta o uso
        de memória, processamento e o tamanho da resposta. Versões futuras poderão limitar base64 para arquivos maiores
        que 5 MB.

        - **generate_mp3** (boolean, default: true): Para áudios, define formato de retorno
          - `true`: Retorna MP3
          - `false`: Retorna OGG
        - **return_link** (boolean, mantido para compatibilidade): A resposta inclui a URL pública do arquivo

        - **transcribe** (boolean, default: false): Transcreve áudios para texto

        - **openai_apikey** (string, opcional): Chave OpenAI para transcrição
          - Se não informada, usa a chave salva na instância
          - Se informada, atualiza e salva na instância para próximas chamadas
        - **download_quoted** (boolean, default: false): Baixa mídia da mensagem citada
          - Útil para baixar conteúdo original de status do WhatsApp
          - Quando uma mensagem é resposta a um status, permite baixar a mídia do status original
          - **Contextualização**: Ao baixar a mídia citada, você identifica o contexto da conversa
            - Exemplo: Se alguém responde a uma promoção, baixando a mídia você saberá que a pergunta é sobre aquela promoção específica

        ## Exemplos


        ### Baixar áudio como MP3:

        ```json

        {
          "id": "7EB0F01D7244B421048F0706368376E0",
          "generate_mp3": true
        }

        ```


        ### Transcrever áudio:

        ```json

        {
          "id": "7EB0F01D7244B421048F0706368376E0",
          "transcribe": true
        }

        ```


        ### Incluir o conteúdo em base64:

        ```json

        {
          "id": "7EB0F01D7244B421048F0706368376E0",
          "return_base64": true
        }

        ```


        ### Baixar mídia de status (mensagem citada):

        ```json

        {
          "id": "7EB0F01D7244B421048F0706368376E0",
          "download_quoted": true
        }

        ```

        *Útil quando o cliente responde a uma promoção/status - você baixa a mídia original para entender sobre qual
        produto/oferta ele está perguntando.*


        ## Resposta


        ```json

        {
          "fileURL": "https://api.exemplo.com/files/arquivo.mp3",
          "mimetype": "audio/mpeg",
          "base64Data": "UklGRkj...",
          "transcription": "Texto transcrito"
        }

        ```


        **Nota**: 

        - Por padrão, áudios são retornados como MP3 e todos os downloads incluem uma URL pública em `fileURL`.

        - Evite `return_base64: true`: a conversão aumenta o uso de memória e processamento no servidor e produz uma
        resposta maior. Prefira baixar o arquivo por `fileURL`.

        - Compatibilidade futura: o retorno em base64 poderá ser limitado para arquivos maiores que 5 MB. Não dependa de
        base64 para arquivos grandes.

        - Transcrição requer chave OpenAI válida. A chave pode ser configurada uma vez na instância e será reutilizada
        automaticamente.

        - Retenção de mídia: o arquivo fica disponível no nosso CDN por 2 dias. Depois disso, `fileURL` deixa de
        funcionar. Chame este endpoint novamente para gerar uma nova URL, enquanto a mensagem e a mídia original ainda
        estiverem disponíveis.

        - Para conservar a mídia por mais de 2 dias, baixe o arquivo pela `fileURL` e salve-o em um armazenamento
        próprio. Guardar somente a URL não aumenta o prazo de retenção.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID da mensagem contendo o arquivo
                  example: 7EB0F01D7244B421048F0706368376E0
                return_base64:
                  type: boolean
                  description: >-
                    Inclui o conteúdo em base64. Evite em arquivos grandes; versões futuras poderão limitar arquivos
                    maiores que 5 MB
                  default: false
                generate_mp3:
                  type: boolean
                  description: Para áudios, define formato de retorno (true=MP3, false=OGG)
                  default: true
                return_link:
                  type: boolean
                  description: Mantido para compatibilidade. A URL pública é sempre retornada em fileURL
                  default: true
                transcribe:
                  type: boolean
                  description: Se verdadeiro, transcreve áudios para texto
                  default: false
                openai_apikey:
                  type: string
                  description: Chave da API OpenAI para transcrição (opcional)
                  example: sk-...
                download_quoted:
                  type: boolean
                  description: Se verdadeiro, baixa mídia da mensagem citada ao invés da mensagem principal
                  default: false
              required:
                - id
      responses:
        '200':
          description: Successful file download
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileURL:
                    type: string
                    description: URL pública do arquivo, disponível por 2 dias
                    example: https://api.exemplo.com/files/arquivo.mp3
                  mimetype:
                    type: string
                    description: Tipo MIME do arquivo
                    example: audio/mpeg
                  base64Data:
                    type: string
                    description: Conteúdo do arquivo em base64 (se return_base64=true)
                    example: UklGRkj...
                  transcription:
                    type: string
                    description: Texto transcrito do áudio (se transcribe=true)
                    example: Texto transcrito
                required:
                  - mimetype
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unsupported media type or no media found in message
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - Message not found
                      - No quoted message found in this message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to download media
  /message/find:
    post:
      operationId: findMessages
      tags:
        - Ações na mensagem e Buscar
      summary: Buscar mensagens em um chat
      description: |
        Busca mensagens com múltiplos filtros disponíveis. Este endpoint permite:

        1. **Busca por ID específico**: Use `id` para encontrar uma mensagem exata
        2. **Filtrar por chat**: Use `chatid` para mensagens de uma conversa específica
        3. **Filtrar por rastreamento**: Use `track_source` e `track_id` para mensagens com dados de tracking
        4. **Histórico de ligações**: Use apenas `messageType: call`, `limit` e `offset`
           para listar as chamadas mais recentes. A resposta pode trazer
           `callPeer` (identidade conhecida do contato) e `content.isVideo`.
        5. **Limitar resultados**: Use `limit` para controlar quantas mensagens retornar
        6. **Ordenação**: Resultados ordenados por data (mais recentes primeiro)

        As mensagens guardadas não trazem as miniaturas em base64 do `content`
        (`JPEGThumbnail` e afins); elas chegam só no webhook, na hora da mensagem.
        Depois do envio, o `send_payload` também perde o arquivo em base64, trocado
        por um marcador com o tipo e o tamanho. Enquanto a mensagem pode ser
        reenviada (na fila, agendada ou, em conversa individual, até 1 hora depois
        de enviada pela API), o `send_payload` fica completo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID específico da mensagem para busca exata
                  example: user123:r3EB0538
                chatid:
                  type: string
                  description: ID do chat no formato internacional
                  example: 5511999999999@s.whatsapp.net
                messageType:
                  type: string
                  description: Tipo da mensagem. Use `call` com `limit` e `offset` para o histórico de ligações.
                  example: call
                track_source:
                  type: string
                  description: Origem do rastreamento para filtrar mensagens
                  example: chatwoot
                track_id:
                  type: string
                  description: ID de rastreamento para filtrar mensagens
                  example: msg_123456789
                limit:
                  type: integer
                  description: >-
                    Número máximo de mensagens a retornar (padrão 100, sem máximo). Para muitas mensagens, prefira
                    páginas de até 1000 e avance com `pagination.nextOffset`.
                  minimum: 1
                  default: 100
                  example: 20
                offset:
                  type: integer
                  description: Deslocamento para paginacao (0 retorna as mensagens mais recentes)
                  default: 0
            examples:
              chatSearch:
                summary: Buscar por chat especifico
                description: Busca mensagens de uma conversa especifica
                value:
                  chatid: 5511999999999@s.whatsapp.net
                  limit: 20
                  offset: 0
              idSearch:
                summary: Buscar por ID especifico
                description: Busca uma mensagem especifica pelo seu ID
                value:
                  id: user123:r3EB0538
              trackingSearch:
                summary: Buscar por rastreamento
                description: Busca mensagens usando dados de tracking com paginacao
                value:
                  track_source: chatwoot
                  track_id: conv_123456
                  limit: 50
                  offset: 100
              callHistory:
                summary: Histórico de ligações
                value:
                  messageType: call
                  limit: 40
                  offset: 0
      responses:
        '200':
          description: Lista de mensagens encontradas com metadados de paginacao
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  pagination:
                    type: object
                    description: >-
                      Dados da página, como nas outras listas, sem `totalRecords` (contar as mensagens pesaria a cada
                      página).
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
                        description: Há mais mensagens depois desta página.
                      nextOffset:
                        type: integer
                        description: Offset da próxima página.
        '400':
          description: Parametros invalidos
        '401':
          description: Token invalido ou expirado
        '404':
          description: Chat nao encontrado
        '500':
          description: Erro interno do servidor
  /message/status:
    post:
      operationId: getMessageReceipts
      tags:
        - Ações na mensagem e Buscar
      summary: Status da mensagem em grupo
      description: >-
        Mostra quem recebeu e quem leu uma mensagem que você enviou num grupo: primeiro um resumo com os totais, depois
        a lista de cada participante.


        - `summary`: quantos participantes receberam (`delivered`) e leram (`read`). Quem leu também conta como
        recebido, e quem ouviu um áudio ou vídeo conta como lido.

        - `receipts`: um item por participante e estado, em páginas, como nas outras listas da API: para a próxima,
        envie o `pagination.nextOffset` em `offset` enquanto `pagination.hasMore` for `true`. O resumo vem igual em
        todas as páginas.

        - `state` filtra a lista por estado: `Delivered`, `Read` ou `Played`. O resumo continua com os totais da
        mensagem.

        - `id` aceita o ID completo ou o curto da mensagem.

        - Esta rota é a fonte de verdade das confirmações de grupo. O webhook `messages_update` com `type:
        "GroupReceipts"` é só um aviso e pode não sair num reinício do servidor.

        - As confirmações aparecem na hora, inclusive as que o webhook ainda vai agrupar.

        - Mensagem sem confirmações, apagada ou de outro número retorna o resumo zerado e a lista vazia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: ID da mensagem (completo ou curto).
                  example: 3EB0538DA65A59F6D8A251
                state:
                  type: string
                  enum:
                    - Delivered
                    - Read
                    - Played
                  description: Só as confirmações deste estado. Sem ele, todas.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 100
                  description: Itens por página. Acima de 500 usa 500.
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Deslocamento base zero; use o `pagination.nextOffset` da página anterior.
      responses:
        '200':
          description: Resumo e página de confirmações, em ordem de gravação.
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - receipts
                  - pagination
                properties:
                  summary:
                    type: object
                    description: Totais de participantes; o mesmo em todas as páginas.
                    required:
                      - delivered
                      - read
                    properties:
                      delivered:
                        type: integer
                        format: int64
                        description: Participantes que receberam, incluindo quem leu ou ouviu.
                      read:
                        type: integer
                        format: int64
                        description: Participantes que leram, incluindo quem ouviu um áudio ou vídeo.
                  receipts:
                    type: array
                    items:
                      type: object
                      required:
                        - participant
                        - participant_pn
                        - participant_lid
                        - state
                        - timestamp
                      properties:
                        participant:
                          type: string
                          description: 'Quem confirmou: o número quando conhecido; senão, o LID.'
                        participant_pn:
                          type:
                            - string
                            - 'null'
                        participant_lid:
                          type:
                            - string
                            - 'null'
                        state:
                          type: string
                          enum:
                            - Delivered
                            - Read
                            - Played
                        timestamp:
                          type: integer
                          format: int64
                          description: Segundos Unix da primeira confirmação desse participante e estado.
                  pagination:
                    type: object
                    required:
                      - totalRecords
                      - limit
                      - offset
                      - hasMore
                      - nextOffset
                    properties:
                      totalRecords:
                        type: integer
                        format: int64
                        description: Total de confirmações da mensagem.
                      limit:
                        type: integer
                        description: Limite aplicado na página atual.
                      offset:
                        type: integer
                        description: Offset retornado, limitado ao intervalo de zero até totalRecords.
                      hasMore:
                        type: boolean
                        description: Há mais confirmações depois desta página.
                      nextOffset:
                        type: integer
                        description: Offset da próxima página.
        '400':
          description: Payload inválido ou `id` ausente
        '401':
          description: Token inválido ou ausente
        '500':
          description: Erro ao consultar as confirmações
  /message/history-sync:
    post:
      operationId: requestHistorySync
      tags:
        - Ações na mensagem e Buscar
      summary: Solicitar histórico sob demanda de um chat
      description: >
        Solicita ao WhatsApp um sync sob demanda de mensagens antigas de um chat

        ou tenta recuperar uma mensagem exata já conhecida localmente.


        Modos suportados:

        - `history` (padrão): busca histórico para trás a partir de uma mensagem âncora

        - `exact`: tenta recarregar a mensagem exata informada em `messageid`


        Regras:

        - envie `number`

        - `mode` é opcional; quando omitido, assume `history`

        - em `mode=history`, `count` é opcional e limitado a 100

        - em `mode=history`, `messageid` é opcional; quando informado, a API usa essa mensagem como referência para
        buscar mensagens mais antigas do chat

        - em `mode=exact`, `messageid` é obrigatório e `count` não é necessário


        Observação:

        - **Importante:** a recuperação pode só acontecer depois de abrir o WhatsApp no celular ou deixá-lo ativo em
        segundo plano

        - em `mode=history`, `messageid` define a mensagem de referência para carregar histórico anterior

        - em `mode=history`, esse campo não serve para buscar essa mensagem específica

        - em `mode=history`, o histórico é buscado para trás a partir da mensagem de referência informada

        - se você quiser recuperar apenas uma mensagem específica `X` via histórico, informe como `messageid` a mensagem
        logo depois de `X` e use `count=1`

        - se `messageid` não for informado em `mode=history`, a API usa a mensagem mais antiga conhecida localmente
        desse chat como referência para buscar histórico anterior

        - em `mode=exact`, a API tenta um rerequest da mensagem exata informada em `messageid`

        - **`mode=exact` está em teste** e funciona melhor quando a mensagem já existe no histórico local da instância

        - as mensagens retornam depois via webhook/SSE em eventos do tipo `history` e também ficam disponíveis em
        `/message/find`


        ## Resultado em `mode=history`


        A resposta traz o `request_id` do pedido. As mensagens chegam no webhook/SSE `history` com `event: "messages"` e
        o `request_id` em cada mensagem. Ele também vem no topo dos lotes `messages` e `chats` quando todo o lote
        pertence ao mesmo pedido; lotes mistos podem omiti-lo no topo. O pedido termina com um único lote `event:
        "status"` com o mesmo `request_id`:


        - `status`: `completed` quando o WhatsApp confirma a conclusão do pedido, `timeout` quando não houve resposta
        conclusiva em 2 minutos

        - `has_more`: `true` há mais mensagens no celular, `false` chegou ao início da conversa, `null` não foi
        confirmado

        - `history_access`: `unavailable` quando há mais mensagens, mas o WhatsApp não dá acesso a elas

        - `next_request`: corpo pronto para pedir as mensagens anteriores; reenvie como veio. `null` quando não há uma
        próxima requisição utilizável


        Para paginar, reenvie `next_request` do resultado final até ele vir `null`, aguardando o resultado de cada
        pedido. `completed` encerra o pedido, não toda a conversa. `next_request: null` sem `has_more: false` não
        comprova o início da conversa. Silêncio ou um lote com menos mensagens que `count` não indicam o fim do
        histórico: só `has_more: false` indica.


        Cada chat tem um pedido ativo por vez. Repetir o pedido com a mesma mensagem de referência antes do `status`
        devolve o mesmo `request_id` (`details.reused: true`), sem novo envio ao celular. Um pedido com outra referência
        encerra o anterior, que recebe o próprio `status` final (em geral `timeout`), e segue normalmente. `409` só
        ocorre quando o `requestId` informado já está em uso.


        O resultado final chega por webhook/SSE em até 2 minutos após enviar o pedido ao WhatsApp
        (`details.result_timeout_ms`). Mensagens atrasadas podem continuar chegando com o mesmo `request_id` por cerca
        de 5 minutos após o pedido, sem um segundo status final.


        ## Modo síncrono (`sync: true`)


        Em `mode=history`, `sync: true` segura a resposta até o resultado, por até `timeoutMs` (padrão e máximo 25000).
        As mensagens vêm em `messages`, e o topo da resposta traz os mesmos campos do `status` final (`status`,
        `has_more`, `history_access`, `received_messages`, `next_request`), além de `received`, `timed_out` e `partial`:


        - resultado final dentro do prazo: `200` com esse resultado;

        - chegaram mensagens, mas não o resultado: `200` com `status: "pending"`, cerca de 2 segundos depois da última
        mensagem;

        - nada chegou no prazo: `202` com `status: "pending"`, `timed_out: true` e `messages` vazio.


        Com `status: "pending"`, o resultado final chega depois pelo webhook/SSE `history`, com o mesmo `request_id`. O
        webhook e o SSE são enviados também no modo síncrono, e as mensagens são salvas do mesmo jeito. Em `mode=exact`,
        `sync` é ignorado.


        ## Mensagem de referência apagada


        Se a âncora foi apagada, a API tenta usar a próxima mensagem válida desse chat.
        `details.requested_anchor_messageid` informa a referência solicitada, `details.anchor_messageid` a usada e
        `details.anchor_replaced` indica a substituição. Sem alternativa, retorna HTTP `400` com `status:
        "anchor_unavailable"`; tente sem `messageid` para usar a mensagem mais antiga salva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
              properties:
                mode:
                  type: string
                  enum:
                    - history
                    - exact
                  default: history
                  description: |
                    Define o comportamento da operação.
                    - `history`: busca mensagens mais antigas a partir de uma âncora
                    - `exact`: tenta recuperar a mensagem exata informada em `messageid`
                  example: history
                messageid:
                  type: string
                  description: |
                    Em `mode=history`, ID da mensagem de referência usada para buscar mensagens mais antigas do chat.
                    Em `mode=exact`, ID exato da mensagem que deve ser recarregada.
                  example: 3EB01234567890ABCDEF
                number:
                  type: string
                  description: >-
                    JID completo do chat. Mantido obrigatório em todos os modos para simplificar o contrato público e
                    restringir a busca ao chat esperado.
                  example: 5511999999999@s.whatsapp.net
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Quantidade desejada de mensagens no sync em `mode=history`. Em `mode=exact`, este campo é ignorado.
                  example: 20
                  default: 50
                timestamp:
                  type: integer
                  description: >-
                    Timestamp da mensagem de referência, em milissegundos ou segundos. Opcional; vem no `next_request`
                    para a referência funcionar mesmo antes de a mensagem estar salva.
                  example: 1706350400000
                fromMe:
                  type: boolean
                  description: >-
                    Indica se a mensagem de referência foi enviada pela conta conectada. Opcional; vem no
                    `next_request`.
                  example: false
                requestId:
                  type: string
                  description: >-
                    Identificador opcional escolhido pelo cliente; quando omitido, a API gera um UUID. Retorna como
                    request_id. Use um id novo por pedido: um id já em uso recebe `409`.
                  example: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
                fallbackMode:
                  type: string
                  enum:
                    - try_alternates
                    - exact
                  default: try_alternates
                  description: >-
                    Para onde o pedido é enviado. `try_alternates` (padrão): em conversa individual, envia pelo número e
                    pelo LID do chat, porque o celular guarda cada conversa por um dos dois endereços e ignora o pedido
                    enviado pelo outro; a resposta chega uma vez só. `exact`: envia só pelo endereço preferido do chat
                    (o LID, quando conhecido). Em grupos, o pedido vai sempre só para o grupo.
                sync:
                  type: boolean
                  default: false
                  description: >-
                    Em `mode=history`, segura a resposta até o resultado do pedido, por até `timeoutMs`. Veja "Modo
                    síncrono".
                timeoutMs:
                  type: integer
                  default: 25000
                  maximum: 25000
                  description: 'Só com `sync: true`: espera máxima em milissegundos. Valores maiores viram 25000.'
            examples:
              recuperar_mensagem_exata:
                summary: Recuperar a mensagem exata informada
                value:
                  number: 5511999999999@s.whatsapp.net
                  mode: exact
                  messageid: 3EB01234567890ABCDEF
              usando_ancora_explicita:
                summary: Buscar histórico anterior a uma mensagem de referência
                value:
                  number: 5511999999999@s.whatsapp.net
                  mode: history
                  messageid: 3EB01234567890ABCDEF
                  count: 20
              recuperar_mensagem_especifica:
                summary: Recuperar apenas a mensagem imediatamente anterior à referência
                value:
                  number: 5511999999999@s.whatsapp.net
                  mode: history
                  messageid: 3EB0MENSAGEM_LOGO_APOS_X
                  count: 1
              usando_ancora_local:
                summary: Reutilizar âncora local já persistida
                value:
                  number: 5511999999999@s.whatsapp.net
                  mode: history
                  count: 50
              proxima_pagina:
                summary: Pedir as mensagens anteriores com o next_request recebido
                value:
                  number: 5511999999999@s.whatsapp.net
                  count: 50
                  messageid: 3EB0MAIS_ANTIGA_RECEBIDA
                  timestamp: 1706350400000
                  fromMe: false
              modo_sincrono:
                summary: Esperar o resultado na resposta (modo síncrono)
                value:
                  number: 5511999999999@s.whatsapp.net
                  count: 50
                  sync: true
                  timeoutMs: 20000
      responses:
        '200':
          description: >-
            Solicitação enviada com sucesso. As mensagens e o resultado chegam depois por webhook/SSE. Com `sync: true`,
            traz também as mensagens e o resultado do pedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  request_id:
                    type: string
                    description: >-
                      Identifica o pedido. Em mode=history, aparece nas mensagens correlacionadas e no status final do
                      webhook/SSE history.
                    example: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
                  mode:
                    type: string
                    example: history
                  message:
                    type: string
                    example: History sync request sent. Messages will be received as history sync events.
                  details:
                    type: object
                    additionalProperties: true
                    description: Metadados adicionais da operação
                    properties:
                      result_timeout_ms:
                        type: integer
                        example: 120000
                        description: Prazo para o resultado final por webhook/SSE.
                      requested_anchor_messageid:
                        type: string
                        description: Referência originalmente solicitada.
                      anchor_messageid:
                        type: string
                        description: Referência efetivamente usada.
                      anchor_replaced:
                        type: boolean
                        description: A referência apagada foi substituída por uma mensagem válida posterior.
                      reused:
                        type: boolean
                        description: >-
                          O pedido repete a referência de um pedido em andamento: a API devolve o `request_id` dele e
                          não envia outro pedido ao celular.
                      fallback_mode:
                        type: string
                        enum:
                          - try_alternates
                          - exact
                        description: Modo de envio usado (`fallbackMode`).
                      attempted_chats:
                        type: array
                        items:
                          type: string
                        description: Endereços do chat para os quais o pedido foi enviado.
                  sync:
                    type: boolean
                    description: '`true` quando a resposta esperou o resultado (`sync: true`).'
                  status:
                    type: string
                    enum:
                      - completed
                      - timeout
                      - pending
                    description: >-
                      Só no modo síncrono: resultado do pedido; `pending` quando ainda não chegou e virá pelo
                      webhook/SSE.
                  request_chat:
                    type: string
                    description: 'Só no modo síncrono: chat do pedido.'
                  has_more:
                    type:
                      - boolean
                      - 'null'
                    description: 'Só no modo síncrono: `true` há mais mensagens, `false` início da conversa, `null` não confirmado.'
                    nullable: true
                  history_access:
                    type: string
                    enum:
                      - available
                      - unavailable
                      - unknown
                    description: 'Só no modo síncrono: `unavailable` quando há mais mensagens sem acesso.'
                  received_messages:
                    type: integer
                    description: 'Só no modo síncrono: quantidade de mensagens em `messages`.'
                  next_request:
                    type:
                      - object
                      - 'null'
                    additionalProperties: true
                    description: 'Só no modo síncrono: corpo pronto para pedir as mensagens anteriores, ou `null`.'
                    nullable: true
                  received:
