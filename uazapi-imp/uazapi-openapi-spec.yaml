                  inviteLink:
                    type: string
                    description: Link de convite completo para o grupo
                    example: https://chat.whatsapp.com/AbCdEfGhIjKlMnOpQrStUv
        '400':
          description: Erro ao processar a solicitação
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrição do erro
        '401':
          description: Token inválido ou ausente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detalhes do erro interno
  /group/join:
    post:
      operationId: joinGroup
      tags:
        - Grupos e Comunidades
      summary: Entrar em um grupo usando código de convite
      description: |
        Permite entrar em um grupo do WhatsApp usando um código de convite ou URL completo. 

        Características:
        - Suporta código de convite ou URL completo
        - Valida o código antes de tentar entrar no grupo
        - Retorna informações básicas do grupo após entrada bem-sucedida
        - Trata possíveis erros como convite inválido ou expirado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitecode
              properties:
                invitecode:
                  type: string
                  description: |
                    Código de convite ou URL completo do grupo. 
                    Formatos aceitos:
                    - Código completo: "IYnl5Zg9bUcJD32rJrDzO7"
                    - URL completa: "https://chat.whatsapp.com/IYnl5Zg9bUcJD32rJrDzO7"
                  example: https://chat.whatsapp.com/IYnl5Zg9bUcJD32rJrDzO7
                  minLength: 10
                  maxLength: 50
      responses:
        '200':
          description: Entrada no grupo realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group join successful
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '400':
          description: Código de convite inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid invite code
        '403':
          description: Usuário já está no grupo ou não tem permissão para entrar
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unable to join group
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Error processing group invite
  /group/leave:
    post:
      operationId: leaveGroup
      tags:
        - Grupos e Comunidades
      summary: Sair de um grupo
      description: |
        Remove o usuário atual de um grupo específico do WhatsApp.

        Requisitos:
        - O usuário deve estar conectado a uma instância válida
        - O usuário deve ser um membro do grupo

        Comportamentos:
        - Se o usuário for o último administrador, o grupo será dissolvido
        - Se o usuário for um membro comum, será removido do grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: |
                    Identificador único do grupo (JID)
                    - Formato: número@g.us
                    - Exemplo válido: 120363324255083289@g.us
                  example: 120363324255083289@g.us
                  pattern: ^\d+@g\.us$
              required:
                - groupjid
      responses:
        '200':
          description: Saída do grupo realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group leave successful
        '400':
          description: Erro de payload inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid payload
        '500':
          description: Erro interno do servidor ou falha na conexão
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: error leaving group
  /group/list:
    get:
      operationId: listGroups
      tags:
        - Grupos e Comunidades
      summary: Listar todos os grupos (legado)
      description: >
        Mantido para integrações existentes. Retorna a coleção de grupos sem paginação e pode produzir uma resposta
        grande. Para novas integrações, prefira POST /group/list.


        ### Opções avançadas

        `noParticipants=true` retorna a lista sem membros, como no POST. `force`

        pode reutilizar uma atualização recente. Para consultar membros, use

        POST /group/info no grupo escolhido.
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: >-
            Solicita atualização da lista. Pode reutilizar a última atualização bem-sucedida durante o intervalo mínimo
            local de 20 segundos.
        - name: noParticipants
          in: query
          schema:
            type: boolean
            default: false
          description: Use true para retornar a lista sem os participantes.
      responses:
        '200':
          description: Lista de grupos recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                    description: Lista detalhada de grupos
        '400':
          description: Parâmetro inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Erro interno do servidor ao recuperar grupos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem detalhando o erro encontrado
      security:
        - token: []
    post:
      operationId: refreshGroups
      tags:
        - Grupos e Comunidades
      summary: Listar grupos em páginas (recomendado)
      description: >
        Use esta operação para buscar grupos e escolher qual abrir. Prefira uma página de resumos sem a lista de
        membros; consulte POST /group/info quando precisar dos detalhes de um grupo.


        ### Uso recomendado

        Envie search, limit e offset, com noParticipants=true. O padrão de página é 50 e o máximo é 1000. A busca
        considera nome, JID, descrição do grupo e nome da comunidade à qual ele pertence. A resposta contém groups e
        pagination.


        ### Opções avançadas e compatibilidade

        - O default HTTP de noParticipants continua false para preservar integrações existentes. O exemplo recomendado
        usa true explicitamente.

        - Para participantes e perfis completos, consulte somente o grupo selecionado em POST /group/info.

        - force solicita atualização do WhatsApp. Normalmente basta deixar a API atualizar quando necessário; não use
        force em polling contínuo.


        Uma atualização remota da lista ainda pode receber participantes do WhatsApp; noParticipants=true evita
        carregá-los na leitura da página e enviá-los na resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  description: Quantidade maxima de resultados por pagina (padrao 50, maximo 1000)
                  default: 50
                  minimum: 1
                  maximum: 1000
                offset:
                  type: integer
                  description: Deslocamento base zero
                  default: 0
                search:
                  type: string
                  description: Busca por nome, tópico, JID ou nome da comunidade pai.
                force:
                  type: boolean
                  default: false
                  description: >-
                    Avançado: solicita atualização remota. Não é necessário no fluxo normal; não use em polling
                    contínuo.
                noParticipants:
                  type: boolean
                  default: false
                  description: >-
                    Compatibilidade: true retorna resumos sem membros, como no exemplo recomendado. O default HTTP
                    continua false.
            examples:
              summaries:
                summary: Listagem leve para escolher um grupo
                value:
                  search: Suporte
                  limit: 50
                  offset: 0
                  noParticipants: true
              next_page:
                summary: Próxima página de resumos
                value:
                  limit: 50
                  offset: 50
                  noParticipants: true
      responses:
        '200':
          description: Lista de grupos recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                    description: Lista detalhada de grupos
                  pagination:
                    type: object
                    properties:
                      totalRecords:
                        type: integer
                        description: Total de grupos encontrados
                      limit:
                        type: integer
                        description: Limite aplicado na pagina atual
                      offset:
                        type: integer
                        description: Offset retornado, limitado ao intervalo de zero até totalRecords.
                      hasMore:
                        type: boolean
                        description: Há mais registros depois desta página.
                      nextOffset:
                        type: integer
                        description: Offset da próxima página.
        '400':
          description: Payload inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Erro interno do servidor ao recuperar grupos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem detalhando o erro encontrado
      security:
        - token: []
  /group/resetInviteCode:
    post:
      operationId: resetGroupInviteCode
      tags:
        - Grupos e Comunidades
      summary: Resetar código de convite do grupo
      description: |
        Gera um novo código de convite para o grupo, invalidando o código de convite anterior. 
        Somente administradores do grupo podem realizar esta ação.

        Principais características:
        - Invalida o link de convite antigo
        - Cria um novo link único
        - Retorna as informações atualizadas do grupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo (JID)
                  example: 120363308883996631@g.us
              required:
                - groupjid
      responses:
        '200':
          description: Código de convite resetado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  InviteLink:
                    type: string
                    description: Novo link de convite gerado
                    example: https://chat.whatsapp.com/AbCdEfGhIjKlMnOpQrStUv
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not parse Group JID
        '403':
          description: Usuário sem permissão
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User is not an admin of this group
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to reset group invite link
  /group/updateAnnounce:
    post:
      operationId: updateGroupAnnounce
      tags:
        - Grupos e Comunidades
      summary: Configurar permissões de envio de mensagens no grupo
      description: |
        Define as permissões de envio de mensagens no grupo, permitindo restringir o envio apenas para administradores.

        Quando ativado (announce=true):
        - Apenas administradores podem enviar mensagens
        - Outros participantes podem apenas ler
        - Útil para anúncios importantes ou controle de spam

        Quando desativado (announce=false):
        - Todos os participantes podem enviar mensagens
        - Configuração padrão para grupos normais

        Requer que o usuário seja administrador do grupo para fazer alterações.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo no formato xxxx@g.us
                  example: 120363339858396166@g.us
                announce:
                  type: boolean
                  description: Controla quem pode enviar mensagens no grupo
                  example: true
              required:
                - groupjid
                - announce
      responses:
        '200':
          description: Configuração atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group announce enabled successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Usuário não é administrador do grupo
        '404':
          description: Grupo não encontrado
        '500':
          description: Erro interno do servidor ou falha na API do WhatsApp
  /group/updateJoinApproval:
    post:
      operationId: updateGroupJoinApproval
      tags:
        - Grupos e Comunidades
      summary: Configurar aprovação para entrada no grupo
      description: |
        Define se novos participantes precisam ser aprovados antes de entrar no grupo.
        No objeto retornado em `group` e também em `/group/info`, esse estado aparece no campo `IsJoinApprovalRequired`.

        Quando ativado (`IsJoinApprovalRequired=true`):
        - Novas entradas passam por aprovação de administrador
        - Solicitações pendentes podem ser listadas em `/group/info`

        Quando desativado (`IsJoinApprovalRequired=false`):
        - Entradas por link/convite não exigem aprovação adicional

        Requer que o usuário seja administrador do grupo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo no formato xxxx@g.us
                  example: 120363339858396166@g.us
                IsJoinApprovalRequired:
                  type: boolean
                  description: Define se a entrada no grupo exige aprovação; reflete no campo `IsJoinApprovalRequired`
                  example: true
              required:
                - groupjid
                - IsJoinApprovalRequired
      responses:
        '200':
          description: Configuração atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group join approval enabled successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
              examples:
                success:
                  summary: Aprovação de entrada ativada
                  value:
                    response: Group join approval enabled successfully
                    group:
                      JID: 120363339858396166@g.us
                      IsJoinApprovalRequired: true
                    needs_refresh: false
        '400':
          description: Payload inválido ou campo IsJoinApprovalRequired ausente/inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: IsJoinApprovalRequired is required
        '401':
          description: Token de autenticação ausente ou inválido
        '403':
          description: Usuário não é administrador do grupo
        '404':
          description: Grupo não encontrado
        '500':
          description: Erro interno do servidor ou falha na API do WhatsApp
  /group/updateMemberAddMode:
    post:
      operationId: updateGroupMemberAddMode
      tags:
        - Grupos e Comunidades
      summary: Configurar quem pode adicionar novos membros ao grupo
      description: |
        Define quem tem permissão para adicionar novos participantes diretamente ao grupo.
        No objeto retornado em `group` e também em `/group/info`, esse estado aparece no campo `MemberAddMode`.

        Valores aceitos em `MemberAddMode`:
        - `admin_add`: apenas administradores podem adicionar membros
        - `all_member_add`: qualquer participante pode adicionar membros

        Requer que o usuário seja administrador do grupo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo no formato xxxx@g.us
                  example: 120363339858396166@g.us
                MemberAddMode:
                  type: string
                  enum:
                    - admin_add
                    - all_member_add
                  description: Define quem pode adicionar novos membros ao grupo; reflete no campo `MemberAddMode`
                  example: admin_add
              required:
                - groupjid
                - MemberAddMode
      responses:
        '200':
          description: Configuração atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group member add mode set to admin_add successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
              examples:
                success:
                  summary: Apenas admins podem adicionar membros
                  value:
                    response: Group member add mode set to admin_add successfully
                    group:
                      JID: 120363339858396166@g.us
                      MemberAddMode: admin_add
                    needs_refresh: false
        '400':
          description: Valor inválido para MemberAddMode
        '403':
          description: Usuário não é administrador do grupo
        '404':
          description: Grupo não encontrado
        '500':
          description: Erro interno do servidor ou falha na API do WhatsApp
  /group/updateDescription:
    post:
      operationId: updateGroupDescription
      tags:
        - Grupos e Comunidades
      summary: Atualizar descrição do grupo
      description: |
        Altera a descrição (tópico) do grupo WhatsApp especificado.
        Requer que o usuário seja administrador do grupo.
        A descrição aparece na tela de informações do grupo e pode ser visualizada por todos os participantes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupjid
                - description
              properties:
                groupjid:
                  type: string
                  description: JID (ID) do grupo no formato xxxxx@g.us
                  example: 120363339858396166@g.us
                  pattern: ^[0-9]+@g\.us$
                description:
                  type: string
                  description: Nova descrição/tópico do grupo
                  example: Grupo oficial de suporte
                  maxLength: 512
      responses:
        '200':
          description: Descrição atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group description updated successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '401':
          description: Token inválido ou ausente
        '403':
          description: Usuário não é administrador do grupo
        '404':
          description: Grupo não encontrado
        '413':
          description: Descrição excede o limite máximo permitido
  /group/ephemeral:
    post:
      operationId: updateGroupEphemeral
      summary: Configurar mensagens temporárias em grupo
      description: |
        Define o temporizador de mensagens temporárias (disappearing messages) de um grupo.

        Valores aceitos para a duração:
        - `0` ou `off` para desativar
        - `1d`
        - `7d`
        - `90d`

        Observações:
        - este endpoint é apenas para grupos
        - requer privilégios de administrador do grupo
        - se o identificador informado não for de grupo, a API retorna erro orientando usar `/chat/ephemeral`
        - após sucesso, a resposta devolve o chat e os dados atualizados do grupo
      tags:
        - Grupos e Comunidades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupjid
                - duration
              properties:
                groupjid:
                  type: string
                  description: JID do grupo no formato xxxxx@g.us
                  example: 120363339858396166@g.us
                duration:
                  oneOf:
                    - type: string
                    - type: integer
                  description: Duração desejada para mensagens temporárias
                  example: 1d
            examples:
              ativar_1_dia:
                summary: Ativar por 1 dia
                value:
                  groupjid: 120363339858396166@g.us
                  duration: 1d
              desativar:
                summary: Desativar mensagens temporárias
                value:
                  groupjid: 120363339858396166@g.us
                  duration: 'off'
      responses:
        '200':
          description: Temporizador atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Ephemeral timer updated successfully
                  chat:
                    $ref: '#/components/schemas/Chat'
                  ephemeral:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        example: true
                      seconds:
                        type: integer
                        format: int64
                        example: 86400
                      label:
                        type: string
                        example: 1d
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
              examples:
                sucesso:
                  summary: Timer atualizado
                  value:
                    response: Ephemeral timer updated successfully
                    chat:
                      wa_chatid: 120363339858396166@g.us
                      wa_ephemeralExpiration: 86400
                      wa_isGroup: true
                    ephemeral:
                      enabled: true
                      seconds: 86400
                      label: 1d
                    group:
                      JID: 120363339858396166@g.us
                      IsEphemeral: true
                      DisappearingTimer: 86400
                    needs_refresh: false
        '400':
          description: Payload inválido, grupo inválido ou duração não suportada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'invalid duration. Allowed values: 0, off, 1d, 7d, 90d'
        '401':
          description: Token inválido ou ausente
        '403':
          description: Usuário não é administrador do grupo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: user is not an admin of this group
        '500':
          description: Erro interno ao atualizar o temporizador
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Error updating chat ephemeral timer: connection closed'
  /group/updateImage:
    post:
      operationId: updateGroupImage
      tags:
        - Grupos e Comunidades
      summary: Atualizar imagem do grupo
      description: |
        Altera a imagem do grupo especificado. A imagem pode ser enviada como URL ou como string base64.

        Requisitos da imagem:
        - Formato: JPEG
        - Resolução máxima: 640x640 pixels
        - Imagens maiores ou diferente de JPEG não são aceitas pelo WhatsApp

        Para remover a imagem atual, envie "remove" ou "delete" no campo image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: JID do grupo
                  example: 120363308883996631@g.us
                image:
                  type: string
                  description: |
                    URL da imagem, string base64 ou "remove"/"delete" para remover.
                    A imagem deve estar em formato JPEG e ter resolução máxima de 640x640.
                  examples:
                    - https://example.com/image.jpg
                    - data:image/jpeg;base64,/9j/4AAQSkZJRg...
                    - remove
              required:
                - groupjid
                - image
      parameters: []
      responses:
        '200':
          description: Imagem atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group image updated successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '400':
          description: Erro nos parâmetros da requisição
        '401':
          description: Token inválido ou expirado
        '403':
          description: Usuário não é administrador do grupo
        '413':
          description: Imagem muito grande
        '415':
          description: Formato de imagem inválido
  /group/updateLocked:
    post:
      operationId: updateGroupLocked
      tags:
        - Grupos e Comunidades
      summary: Configurar permissão de edição do grupo
      description: |
        Define se apenas administradores podem editar as informações do grupo. 
        Quando bloqueado (locked=true), apenas administradores podem alterar nome, descrição, 
        imagem e outras configurações do grupo. Quando desbloqueado (locked=false), 
        qualquer participante pode editar as informações.

        Importante:
        - Requer que o usuário seja administrador do grupo
        - Afeta edições de nome, descrição, imagem e outras informações do grupo
        - Não controla permissões de adição de membros
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo (JID)
                  example: 120363308883996631@g.us
                locked:
                  type: boolean
                  description: |
                    Define permissões de edição:
                    - true = apenas admins podem editar infos do grupo
                    - false = qualquer participante pode editar infos do grupo
                  example: true
              required:
                - groupjid
                - locked
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group lock status changed successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '403':
          description: Usuário não é administrador do grupo
        '404':
          description: Grupo não encontrado
  /group/updateName:
    post:
      operationId: updateGroupName
      tags:
        - Grupos e Comunidades
      summary: Atualizar nome do grupo
      description: |
        Altera o nome de um grupo do WhatsApp. Apenas administradores do grupo podem realizar esta operação.
        O nome do grupo deve seguir as diretrizes do WhatsApp e ter entre 1 e 25 caracteres.
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupjid
                - name
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo no formato JID
                  example: 120363339858396166@g.us
                name:
                  type: string
                  description: Novo nome para o grupo
                  example: Grupo de Suporte
                  minLength: 1
                  maxLength: 25
      responses:
        '200':
          description: Nome do grupo atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Group name updated successfully
                  group:
                    $ref: '#/components/schemas/Group'
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '400':
          description: Erro de validação na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid payload
        '401':
          description: Token de autenticação ausente ou inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Usuário não é administrador do grupo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User is not an admin of this group
        '404':
          description: Grupo não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Group not found
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to update group name
  /group/updateParticipants:
    post:
      operationId: updateGroupParticipants
      tags:
        - Grupos e Comunidades
      summary: Gerenciar participantes do grupo
      description: |
        Gerencia participantes do grupo através de diferentes ações:
        - Adicionar ou remover participantes
        - Promover ou rebaixar administradores
        - Aprovar ou rejeitar solicitações pendentes

        Requer que o usuário seja administrador do grupo para executar as ações.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: JID (identificador) do grupo
                  example: 120363308883996631@g.us
                action:
                  type: string
                  description: |
                    Ação a ser executada:
                    - add: Adicionar participantes ao grupo
                    - remove: Remover participantes do grupo
                    - promote: Promover participantes a administradores
                    - demote: Remover privilégios de administrador
                    - approve: Aprovar solicitações pendentes de entrada
                    - reject: Rejeitar solicitações pendentes de entrada
                  enum:
                    - add
                    - remove
                    - promote
                    - demote
                    - approve
                    - reject
                  example: promote
                participants:
                  type: array
                  items:
                    type: string
                  description: |
                    Lista de números de telefone ou JIDs dos participantes.
                    Para números de telefone, use formato internacional sem '+' ou espaços.
                  example:
                    - '5521987654321'
                    - '5511999887766'
              required:
                - groupjid
                - action
                - participants
      responses:
        '200':
          description: Sucesso na operação
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupUpdated:
                    type: array
                    items:
                      type: object
                      properties:
                        JID:
                          type: string
                          description: JID do participante
                        Error:
                          type: integer
                          description: Código de erro (0 para sucesso; 403 quando a privacidade da pessoa bloqueia a adição)
                        AddRequest:
                          type: object
                          nullable: true
                          description: |
                            Presente quando `add` falha por privacidade. Use `Code` e
                            `Expiration` em `POST /send/group-invite` para enviar o convite.
                          properties:
                            Code:
                              type: string
                            Expiration:
                              type: string
                              format: date-time
                    description: Status da operação para cada participante
                  group:
                    $ref: '#/components/schemas/Group'
                    description: Informações atualizadas do grupo
                  needs_refresh:
                    type: boolean
                    description: Indica se os detalhes do grupo precisam ser consultados novamente
                    example: false
        '400':
          description: Erro nos parâmetros da requisição
        '403':
          description: Usuário não é administrador do grupo
        '500':
          description: Erro interno do servidor
  /community/create:
    post:
      operationId: createCommunity
      tags:
        - Grupos e Comunidades
      summary: Criar uma comunidade
      description: >
        Cria uma nova comunidade no WhatsApp. Uma comunidade é uma estrutura que permite agrupar múltiplos grupos
        relacionados sob uma única administração. 


        A comunidade criada inicialmente terá apenas o grupo principal (announcements), e grupos adicionais podem ser
        vinculados posteriormente usando o endpoint `/community/updategroups`.


        **Observações importantes:**

        - O número que cria a comunidade torna-se automaticamente o administrador

        - A comunidade terá um grupo principal de anúncios criado automaticamente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome da comunidade
                  example: Comunidade do Bairro
              required:
                - name
      responses:
        '200':
          description: Comunidade criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    $ref: '#/components/schemas/Group'
                  failed:
                    type: array
                    description: Lista de JIDs que falharam ao serem adicionados
                    items:
                      type: string
                      format: jid
        '400':
          description: Erro na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid payload
        '401':
          description: Token inválido ou não fornecido
        '403':
          description: Sem permissão para criar comunidades
        '429':
          description: Limite de criação de comunidades atingido
        '500':
          description: Erro interno do servidor
  /community/editgroups:
    post:
      operationId: editCommunityGroups
      tags:
        - Grupos e Comunidades
      summary: Gerenciar grupos em uma comunidade
      description: >
        Adiciona ou remove grupos de uma comunidade do WhatsApp. Apenas administradores da comunidade podem executar
        estas operações.


        ## Funcionalidades

        - Adicionar múltiplos grupos simultaneamente a uma comunidade

        - Remover grupos de uma comunidade existente

        - Suporta operações em lote


        ## Limitações

        - Os grupos devem existir previamente

        - A comunidade deve existir e o usuário deve ser administrador

        - Grupos já vinculados não podem ser adicionados novamente

        - Grupos não vinculados não podem ser removidos


        ## Ações Disponíveis

        - `add`: Adiciona os grupos especificados à comunidade

        - `remove`: Remove os grupos especificados da comunidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - community
                - action
                - groupjids
              properties:
                community:
                  type: string
                  description: JID (identificador único) da comunidade
                  example: 120363153742561022@g.us
                action:
                  type: string
                  enum:
                    - add
                    - remove
                  description: |
                    Tipo de operação a ser realizada:
                    * add - Adiciona grupos à comunidade
                    * remove - Remove grupos da comunidade
                groupjids:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9]+@g.us$
                  minItems: 1
                  description: Lista de JIDs dos grupos para adicionar ou remover
                  example:
                    - 120363324255083289@g.us
                    - 120363308883996631@g.us
      responses:
        '200':
          description: Operação realizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: community updated
                  success:
                    type: array
                    items:
                      type: string
                    description: Lista de JIDs dos grupos processados com sucesso
                  failed:
                    type: array
                    items:
                      type: string
                    description: Lista de JIDs dos grupos que falharam no processamento
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '403':
          description: Usuário não é administrador da comunidade
  /newsletter/create:
    post:
      operationId: createNewsletter
      tags:
        - Newsletters e Canais
      summary: Criar canal
      description: |
        Cria um novo canal/newsletter no WhatsApp.

        Observações:
        - `name` é obrigatório
        - `picture` é opcional
        - `picture` aceita URL HTTP/HTTPS, base64 puro ou data URI
        - imagens acima de 1 MB são rejeitadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Canal de Promoções
                description:
                  type: string
                  example: Ofertas e novidades da loja
                picture:
                  type: string
                  description: URL, base64 puro ou data URI da imagem do canal.
                  example: https://example.com/newsletter.png
      responses:
        '200':
          description: Canal criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    type: object
                    description: Metadata do canal retornada pelo WhatsApp.
                    additionalProperties: true
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: name is required
        '401':
          description: Instância não autenticada ou cliente não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: client not found
        '500':
          description: Erro interno ao criar o canal
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: connection closed
        '502':
          description: O WhatsApp não devolveu o canal criado (resposta vazia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: WhatsApp did not return the created channel
