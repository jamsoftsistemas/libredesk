  /chat/editLead:
    post:
      operationId: editLead
      summary: Edita informações de lead
      description: |
        Atualiza as informações de lead associadas a um chat. Permite modificar status do ticket, 
        atribuição de atendente, posição no kanban, tags e outros campos customizados.

        As alterações ficam disponíveis imediatamente nas consultas e nos eventos webhook/SSE.
        para manter a aplicação sincronizada.
      tags:
        - CRM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: |
                    Identificador do chat. Pode ser:
                    - wa_chatid (ex: "5511999999999@s.whatsapp.net")
                    - wa_fastid (ex: "5511888888888:5511999999999")
                  example: 5511999999999@s.whatsapp.net
                chatbot_disableUntil:
                  type: integer
                  format: int64
                  description: |
                    Timestamp UTC até quando o chatbot deve ficar desativado para este chat.
                    Use 0 para reativar imediatamente.
                  example: 1735686000
                lead_isTicketOpen:
                  type: boolean
                  description: |
                    Status do ticket associado ao lead.
                    - true: Ticket está aberto/em atendimento
                    - false: Ticket está fechado/resolvido
                  example: true
                lead_assignedAttendant_id:
                  type: string
                  description: |
                    ID do atendente atribuído ao lead.
                    Use string vazia ("") para remover a atribuição.
                  example: att_123456
                lead_kanbanOrder:
                  type: integer
                  format: int64
                  description: |
                    Posição do card no quadro kanban.
                    Valores maiores aparecem primeiro.
                  example: 1000
                lead_tags:
                  type: array
                  items:
                    type: string
                  description: |
                    Lista de tags associadas ao lead.
                    Tags inexistentes são criadas automaticamente.
                    Tags com `kanban=true` representam a coluna do cartão.
                    Envie array vazio ([]) para remover todas as tags.
                  example:
                    - vip
                    - suporte
                    - prioridade-alta
                lead_name:
                  type: string
                  description: Nome principal do lead
                  example: João Silva
                lead_fullName:
                  type: string
                  description: Nome completo do lead
                  example: João Silva Pereira
                lead_email:
                  type: string
                  format: email
                  description: Email do lead
                  example: joao@exemplo.com
                lead_personalid:
                  type: string
                  description: |
                    Documento de identificação (CPF/CNPJ)
                    Apenas números ou formatado
                  example: 123.456.789-00
                lead_status:
                  type: string
                  description: Status livre do lead no funil de vendas
                  example: qualificado
                lead_notes:
                  type: string
                  description: Anotações sobre o lead
                  example: Cliente interessado em plano premium
                lead_field01:
                  type: string
                  description: Campo personalizado 1
                lead_field02:
                  type: string
                  description: Campo personalizado 2
                lead_field03:
                  type: string
                  description: Campo personalizado 3
                lead_field04:
                  type: string
                  description: Campo personalizado 4
                lead_field05:
                  type: string
                  description: Campo personalizado 5
                lead_field06:
                  type: string
                  description: Campo personalizado 6
                lead_field07:
                  type: string
                  description: Campo personalizado 7
                lead_field08:
                  type: string
                  description: Campo personalizado 8
                lead_field09:
                  type: string
                  description: Campo personalizado 9
                lead_field10:
                  type: string
                  description: Campo personalizado 10
                lead_field11:
                  type: string
                  description: Campo personalizado 11
                lead_field12:
                  type: string
                  description: Campo personalizado 12
                lead_field13:
                  type: string
                  description: Campo personalizado 13
                lead_field14:
                  type: string
                  description: Campo personalizado 14
                lead_field15:
                  type: string
                  description: Campo personalizado 15
                lead_field16:
                  type: string
                  description: Campo personalizado 16
                lead_field17:
                  type: string
                  description: Campo personalizado 17
                lead_field18:
                  type: string
                  description: Campo personalizado 18
                lead_field19:
                  type: string
                  description: Campo personalizado 19
                lead_field20:
                  type: string
                  description: Campo personalizado 20
      responses:
        '200':
          description: Lead atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
              example:
                wa_fastid: '5511888888888:5511999999999'
                wa_chatid: 5511999999999@s.whatsapp.net
                lead_name: João Silva
                lead_status: qualificado
                lead_tags:
                  - vip
                  - suporte
                lead_isTicketOpen: true
                lead_assignedAttendant_id: att_123456
        '400':
          description: Payload inválido
        '404':
          description: Chat não encontrado
        '500':
          description: Erro interno do servidor
  /lead/tags:
    get:
      operationId: listLeadTags
      tags:
        - CRM
      summary: Lista tags de lead
      description: |
        Retorna as tags pertencentes à instância autenticada. Registros com
        `kanban=true` representam as colunas ativas do Kanban.

        A resposta é ordenada com as colunas ativas primeiro, seguidas por
        `kanbanOrder` e nome. O endpoint usa somente dados locais e funciona mesmo
        quando a sessão do WhatsApp está desconectada.
      responses:
        '200':
          description: Tags retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeadTag'
              example:
                - id: r0123456789abcd
                  name: Novo
                  kanban: true
                  kanbanOrder: 1000
                  owner: '5511999999999'
                  created: '2026-09-03 12:00:00.000Z'
                  updated: '2026-09-03 12:00:00.000Z'
        '500':
          description: Erro ao consultar as tags
  /lead/tags/edit:
    post:
      operationId: editLeadTag
      tags:
        - CRM
      summary: Cria, edita ou apaga uma tag de lead
      description: |
        Cria uma tag quando `id` não é informado ou edita uma tag da instância
        autenticada quando `id` está presente.

        Use `kanban=true` para transformar a tag em uma coluna do quadro e
        `kanban=false` para retirá-la do Kanban sem apagar a tag. A alteração vale
        somente para a instância autenticada.

        Use `delete=true` junto de `id` para apagar definitivamente a tag. Ao
        apagar, a tag também é removida dos chats que a utilizam.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Omitir para criar; informar para editar
                name:
                  type: string
                  maxLength: 100
                  description: Obrigatório na criação e opcional na edição
                kanban:
                  type: boolean
                  description: Ativa ou desativa a tag como coluna do Kanban
                kanbanOrder:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Ordem crescente da coluna
                delete:
                  type: boolean
                  description: Apaga definitivamente a tag indicada por `id`
            examples:
              criar_coluna:
                value:
                  name: Em atendimento
                  kanban: true
                  kanbanOrder: 2000
              renomear_coluna:
                value:
                  id: r0123456789abcd
                  name: Em conversa
              apagar_tag:
                value:
                  id: r0123456789abcd
                  delete: true
      responses:
        '200':
          description: Tag atualizada ou apagada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadTag'
        '201':
          description: Tag criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadTag'
        '400':
          description: Payload inválido
        '404':
          description: Tag não encontrada para a instância autenticada
        '409':
          description: Já existe uma tag com o mesmo nome na instância
        '500':
          description: Erro ao salvar a tag
        '503':
          description: Recuperação de uma alteração anterior ainda em andamento
  /contacts:
    get:
      operationId: checkContacts
      tags:
        - Contatos
      summary: Retorna lista de contatos do WhatsApp
      description: |
        Retorna a lista de contatos do WhatsApp conforme o filtro informado em `contactScope`.

        O endpoint realiza:
        - Busca todos os contatos armazenados
        - Filtra para contatos da agenda, fora da agenda ou todos
        - Usa `address_book` como padrao quando `contactScope` nao for informado
        - Retorna dados formatados incluindo JID e informações de nome
      security:
        - token: []
      parameters:
        - in: query
          name: contactScope
          required: false
          schema:
            type: string
            enum:
              - address_book
              - outside_address_book
              - all
            default: address_book
          description: Define se a busca retorna apenas contatos da agenda, apenas fora da agenda ou todos os contatos conhecidos.
      responses:
        '200':
          description: Lista de contatos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jid:
                      type: string
                      description: 'ID único do contato no WhatsApp (formato: número@s.whatsapp.net)'
                      example: 5511999999999@s.whatsapp.net
                    contact_name:
                      type: string
                      description: Nome completo do contato
                      example: Contato Exemplo
                    contact_FirstName:
                      type: string
                      description: Primeiro nome do contato
                      example: Contato
                  example:
                    jid: 5511999999999@s.whatsapp.net
                    contact_name: Contato Exemplo
                    contact_FirstName: Contato
        '401':
          description: Sem sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error
  /contacts/list:
    post:
      operationId: listContacts
      tags:
        - Contatos
      summary: Listar todos os contatos com paginacao
      description: >
        Retorna uma lista paginada de contatos da conta do WhatsApp atualmente conectada.

        Use este endpoint (POST) para controlar `limit` e `offset` via corpo da requisicao.

        O campo `contactScope` permite escolher entre contatos da agenda, fora da agenda ou todos os contatos
        conhecidos.

        A rota GET `/contacts` continua disponivel para quem prefere a lista completa sem paginacao.
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  description: Quantidade maxima de resultados por pagina (padrao 100, maximo 1000)
                  default: 100
                  minimum: 1
                  maximum: 1000
                offset:
                  type: integer
                  description: Deslocamento base zero para paginacao
                  default: 0
                contactScope:
                  type: string
                  description: >-
                    Define se a busca retorna apenas contatos da agenda, apenas fora da agenda ou todos os contatos
                    conhecidos.
                  enum:
                    - address_book
                    - outside_address_book
                    - all
                  default: address_book
            example:
              limit: 100
              offset: 0
              contactScope: address_book
      responses:
        '200':
          description: Lista de contatos recuperada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        jid:
                          type: string
                          description: 'ID unico do contato no WhatsApp (formato: numero@s.whatsapp.net)'
                          example: 5511999999999@s.whatsapp.net
                        contact_name:
                          type: string
                          description: Nome completo do contato (quando salvo)
                          example: Joao Silva
                        contact_FirstName:
                          type: string
                          description: Primeiro nome do contato
                          example: Joao
                  totalDeviceContacts:
                    type: integer
                    description: Total bruto de contatos no dispositivo
                  pagination:
                    type: object
                    properties:
                      totalRecords:
                        type: integer
                        description: Total de contatos apos filtragem
                      limit:
                        type: integer
                        description: Limite aplicado na pagina atual
                      offset:
                        type: integer
                        description: Offset efetivamente usado na pagina atual
                      hasMore:
                        type: boolean
                        description: Há mais registros depois desta página.
                      nextOffset:
                        type: integer
                        description: Offset da próxima página.
        '401':
          description: Token nao fornecido ou invalido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '500':
          description: Erro interno do servidor ao recuperar contatos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem detalhando o erro encontrado
  /contact/add:
    post:
      operationId: addContact
      tags:
        - Contatos
      summary: Adiciona um contato à agenda
      description: |
        Adiciona um novo contato à agenda do celular.

        O endpoint realiza:
        - Adiciona o contato à agenda usando o WhatsApp
        - Usa o campo 'name' tanto para o nome completo quanto para o primeiro nome
        - Salva as informações do contato na agenda do WhatsApp
        - Retorna informações do contato adicionado
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
                - name
              properties:
                number:
                  type: string
                  description: |
                    Número de telefone no formato internacional com código do país obrigatório. 
                    Para Brasil, deve começar com 55. Aceita variações com/sem símbolo +, 
                    com/sem parênteses, com/sem hífen e com/sem espaços. Também aceita formato 
                    JID do WhatsApp (@s.whatsapp.net). Não aceita contatos comerciais (@lid) 
                    nem grupos (@g.us).
                  examples:
                    - +55 (21) 99999-9999
                    - +55 21 99999-9999
                    - +55 21 999999999
                    - '+5521999999999'
                    - '5521999999999'
                    - 5521999999999@s.whatsapp.net
                name:
                  type: string
                  description: Nome completo do contato (será usado como primeiro nome e nome completo)
                  example: João Silva
      responses:
        '200':
          description: Contato adicionado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Contato adicionado com sucesso
                  contact:
                    type: object
                    properties:
                      jid:
                        type: string
                        description: 'ID único do contato no WhatsApp (formato: número@s.whatsapp.net)'
                        example: 5511999999999@s.whatsapp.net
                      name:
                        type: string
                        description: Nome completo do contato
                        example: João Silva
                      phone:
                        type: string
                        description: Número de telefone
                        example: '5511999999999'
        '400':
          description: Dados inválidos na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Número inválido
        '401':
          description: Sem sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Erro ao adicionar contato
