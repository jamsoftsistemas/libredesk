  status_posts:
    post:
      summary: Publicações de Status
      description: >-
        Receba as publicações de Status (`status@broadcast`) dos seus contatos em tempo real, em evento separado de
        `messages`.


        ## Inscrição explícita


        O evento só é entregue a quem inclui `status_posts` pelo nome em `events`, no webhook da instância, no webhook
        global ou no SSE. Lista vazia ou `All` não incluem `status_posts`, para não enviar os Status de todos os
        contatos a quem não pediu. Enquanto ninguém estiver inscrito, a instância descarta os Status recebidos; eles não
        são entregues depois.


        ## Diferenças em relação a messages


        `message.chatid` é sempre `status@broadcast` e `message.isStatus` é `true`. O autor está em `message.sender`,
        com `sender_pn`, `sender_lid` e `senderName` quando disponíveis. Publicações da própria conta chegam com
        `fromMe: true`.


        Enquanto há inscritos, cada publicação é gravada antes do webhook, com `chatid: status@broadcast`: a mídia pode
        ser baixada por `POST /message/download` assim que o evento chega, e a publicação aparece em `POST
        /message/find` (filtrando por `chatid: status@broadcast` ou sem `chatid`). Ela sai na limpeza normal de
        mensagens. A publicação não cria chat nem contador de não lidas e não dispara chatbot, fluxos ou Chatwoot.
        Respostas a um Status continuam chegando pela conversa individual, no evento `messages`.


        ## Limites


        Só publicações recebidas enquanto a instância está conectada. Edições, exclusões, reações e visualizações de
        Status não geram este evento. Os filtros de `excludeMessages` (`fromMeYes`, `fromMeNo`, `wasSentByApi`,
        `wasNotSentByApi`) também valem aqui.
