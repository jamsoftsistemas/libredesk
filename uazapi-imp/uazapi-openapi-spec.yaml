  messages:
    post:
      summary: Mensagens
      description: >-
        Receba mensagens novas e projeções de mensagens enviadas pela instância. Use o objeto `message` como ponto de
        partida para identificar conversa, remetente, conteúdo e ID.


        ## Quando é enviado


        O fluxo de mensagens pode produzir eventos recebidos e enviados. O payload depende do tipo de mensagem e da
        origem; texto, mídia, reações e atualizações relacionadas não têm conteúdo idêntico.


        ## Como processar


        1. Identifique a instância autorizada e a conversa em `message.chatid`.

        2. Preserve `message.id` e `message.messageid`; não converta os IDs em números.

        3. Aplique deduplicação adequada ao seu processamento. Não responda automaticamente a toda mensagem sem
        verificar sua origem.

        4. Para acompanhar entrega/leitura, use também `messages_update`.


        O objeto `chat` pode acompanhar a mensagem. `chatSource` indica a origem do snapshot quando disponível.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: messages
                      description: Nome exato para inscrição e identificação deste evento.
                    message:
                      type: object
                      description: Mensagem normalizada. Campos disponíveis variam conforme o tipo e a origem.
                      properties:
                        id:
                          type: string
                          description: Identificador retornado pelo sistema; preserve como string.
                        messageid:
                          type: string
                          description: ID da mensagem no WhatsApp.
                        chatid:
                          type: string
                          description: JID do contato, grupo ou canal.
                        sender:
                          type: string
                          description: JID do remetente.
                        senderName:
                          type: string
                          description: Nome disponível do remetente.
                        fromMe:
                          type: boolean
                          description: Mensagem enviada pela conta conectada.
                        wasSentByApi:
                          type: boolean
                          description: Origem na API quando esse campo estiver presente na mensagem.
                        isGroup:
                          type: boolean
                          description: Identifica conversa de grupo.
                        messageType:
                          type: string
                          description: Tipo de mensagem normalizado.
                        text:
                          type: string
                          description: Texto ou legenda disponível.
                        messageTimestamp:
                          type: integer
                          description: Timestamp da mensagem em milissegundos Unix.
                        content:
                          description: Conteúdo específico do tipo de mensagem; não possui um formato único.
                        status:
                          type: string
                          description: Estado disponível da mensagem; pode estar vazio.
                      additionalProperties: true
                    chat:
                      type: object
                      description: Snapshot de chat. Atualize pelos campos recebidos; não trate o evento como lista completa.
                      properties:
                        id:
                          type: string
