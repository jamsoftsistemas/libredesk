          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  request_id:
                    type: string
                    description: >-
                      Identifica o pedido. Em mode=history, aparece nas mensagens correlacionadas e no status final do
                      webhook/SSE history.
                    example: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
                  mode:
                    type: string
