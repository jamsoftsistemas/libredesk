                - image
              properties:
                image:
                  type: string
                  description: |
                    Imagem do perfil. Pode ser:
                    - URL da imagem (http/https)
                    - String base64 da imagem
                    - "remove" ou "delete" para remover a imagem atual
                  example: https://picsum.photos/640/640.jpg
                  oneOf:
                    - description: URL da imagem
                      example: https://picsum.photos/640/640.jpg
                    - description: Imagem em base64
                      example: >-
                        data:image/jpeg;base64,
                    - description: Comando para remover imagem
                      example: remove
      responses:
        '200':
          description: Imagem do perfil alterada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Imagem do perfil alterada com sucesso
                  profile:
                    type: object
                    properties:
                      image_updated:
                        type: boolean
                        description: Indica se a imagem foi atualizada
                        example: true
                      image_removed:
                        type: boolean
                        description: Indica se a imagem foi removida
                        example: false
                      updated_at:
                        type: integer
                        description: Timestamp da alteração (Unix timestamp)
                        example: 1704067200
        '400':
          description: Dados inválidos na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Formato de imagem inválido ou URL inacessível
        '401':
          description: Sem sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '403':
          description: Ação não permitida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Limite de alterações excedido ou conta com restrições
        '413':
          description: Imagem muito grande
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Imagem muito grande, tamanho máximo permitido excedido
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Erro ao alterar imagem do perfil
  /instance:
    delete:
      operationId: deleteInstance
      tags:
        - Instancia
      summary: Deletar instância
      description: >
        Remove a instância do sistema. Quando a remoção não puder ser concluída imediatamente, a API retorna `202` e
        finaliza o processo de forma assíncrona. Repetir a requisição durante esse período é seguro.
      security:
        - token: []
      responses:
        '200':
          description: Instância deletada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: Instance Deleted
                  info:
                    type: string
                    example: O dispositivo foi desconectado com sucesso e a instância foi removida do banco de dados.
        '202':
          description: Exclusão agendada e ainda em andamento
