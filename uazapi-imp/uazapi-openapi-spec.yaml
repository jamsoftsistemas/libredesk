          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    description: Resultado por campo
                  updated:
                    type: integer
                    description: Total de campos atualizados
                    example: 3
                  failed:
                    type: integer
                    description: Total de campos que falharam
                    example: 0
              examples:
                sucesso_todos:
                  summary: Todos os campos atualizados
                  value:
                    response:
                      description:
                        status: updated
                      address:
                        status: updated
                      email:
                        status: updated
                    updated: 3
                    failed: 0
        '207':
          description: Sucesso parcial — ao menos um campo falhou
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    description: Resultado por campo
                  updated:
                    type: integer
                    example: 1
                  failed:
                    type: integer
                    example: 1
              examples:
                parcial:
                  summary: Falha em um dos campos
                  value:
                    response:
                      description:
                        status: updated
                      address:
                        status: error
                        error: upstream unavailable
                    updated: 1
                    failed: 1
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro de validação
              examples:
                payload_invalido:
                  value:
                    error: invalid payload
                campo_obrigatorio:
                  value:
                    error: at least one field (description, address, email) is required
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de autenticação
                    example: client not found
        '500':
          description: Falha total — nenhum campo foi atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    description: Resultado por campo
                  updated:
                    type: integer
                    example: 0
                  failed:
                    type: integer
                    example: 3
  /business/catalog/list:
    post:
      operationId: getCatalog
      tags:
        - Business
      summary: Listar os produtos do catálogo
      description: |
        Lista uma página de produtos do catálogo de um perfil comercial no WhatsApp.

        Observações:
        - envie apenas `jid` para buscar a primeira página
        - a paginação pública usa o campo `after`
        - copie exatamente o valor retornado em `response.next` e envie na próxima chamada
        - sem `response.next` na resposta, não há mais páginas
        - o valor de `after` é um token opaco: não tente decodificar ou modificar
        - a integração atual retorna até 50 produtos por chamada
        - a resposta usa exclusivamente o formato atual documentado abaixo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jid:
                  type: string
                  description: JID do catálogo a consultar
                  example: 5511999999999@s.whatsapp.net
                after:
                  type: string
                  description: Token da próxima página. Use exatamente o valor retornado em `response.next`.
                  example: Q1VSU09SX1BST1hJTUFfUEFHSU5B
              required:
                - jid
            examples:
              primeiraPagina:
                summary: Buscar a primeira página do catálogo
                value:
                  jid: 5511999999999@s.whatsapp.net
              proximaPagina:
                summary: Buscar a próxima página usando after
                value:
                  jid: 5511999999999@s.whatsapp.net
                  after: Q1VSU09SX1BST1hJTUFfUEFHSU5B
      responses:
        '200':
          description: Produtos do catálogo recuperados com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    $ref: '#/components/schemas/BusinessCatalogPage'
              examples:
                sucesso:
                  value:
                    response:
                      next: Q1VSU09SX1BST1hJTUFfUEFHSU5B
                      products:
                        - id: '1234567890'
                          name: Produto Exemplo
                          description: Descrição do produto
                          price: '1990'
                          currency: BRL
                          retailer_id: sku-123
                          is_hidden: false
                          is_sanctioned: false
                          product_availability: in stock
                          media:
                            images:
                              - id: img-1
                                request_image_url: https://mmg.whatsapp.net/v/t62.7118-24/...
                                original_image_url: https://lookaside.whatsapp.net/...
                          status_info:
                            status: APPROVED
                            can_appeal: false
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro de validação do payload ou JID
                    example: invalid payload
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro de autenticação
                    example: client not found
        '500':
          description: Erro interno do servidor ao recuperar os produtos do catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem detalhando o erro encontrado
