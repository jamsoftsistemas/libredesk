                      requested_anchor_messageid: 3EB01234567890ABCDEF
                      anchor_messageid: 3EB01234567890ABCDEF
                      anchor_replaced: false
                exact_padrão:
                  summary: Solicitação de mensagem exata enviada
                  value:
                    success: true
                    mode: exact
                    message: Exact message reload request sent. The message will be received if available.
                    request_id: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
                sync_concluido:
                  summary: Modo síncrono com resultado
                  value:
                    success: true
                    mode: history
                    sync: true
                    request_id: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
                    request_chat: 5511999999999@s.whatsapp.net
                    status: completed
                    has_more: true
                    history_access: available
                    received_messages: 1
                    next_request:
                      number: 5511999999999@s.whatsapp.net
                      count: 50
                      messageid: 3EB0MAIS_ANTIGA_RECEBIDA
                      timestamp: 1706350400000
                      fromMe: false
                    received: true
                    timed_out: false
                    partial: true
                    messages:
                      - messageid: 3EB0MAIS_ANTIGA_RECEBIDA
                        chatid: 5511999999999@s.whatsapp.net
                        fromMe: false
                        messageTimestamp: 1706350400000
                        text: Mensagem antiga
                        request_id: 5f0c2a8e-6d1b-4c3a-9e7f-1a2b3c4d5e6f
        '202':
          description: >-
            Só com `sync: true`: nada chegou dentro de `timeoutMs`. O pedido segue e o resultado chega pelo webhook/SSE
