      summary: Nomear campos personalizados de leads
      description: |
        Configura os rótulos dos 20 campos personalizados de leads de uma instância.
        Esta operação não altera os valores armazenados nos chats e não cria aliases
        para placeholders.

        Os campos disponíveis são `lead_field01` a `lead_field20`. Mesmo depois de
