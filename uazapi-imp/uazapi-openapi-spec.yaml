  /instance/presence:
    post:
      operationId: updateInstancePresence
      tags:
        - Instancia
      summary: Atualizar status de presença da instância
      description: >
        Atualiza o status de presença global da conta do WhatsApp atualmente conectada. Este endpoint permite:

        1. Definir se a conta aparece como disponível ("online") ou indisponível

        2. Controlar o status de presença para todos os contatos

        3. Salvar o estado atual da presença para a conta conectada


        Tipos de presença suportados:

        - available: Marca a conta como disponível/online

        - unavailable: Marca a conta como indisponível/offline


        **Atenção**:

        - O status de presença pode ser temporariamente alterado para "available" (online) em algumas situações internas
        da API, e com isso o visto por último também pode ser atualizado.

        - Caso isso for um problema, considere alterar suas configurações de privacidade no WhatsApp para não mostrar o
        visto por último e/ou quem pode ver seu status "online".


        **⚠️ Importante - Limitação do Presence "unavailable"**:

        - **Quando a API é o único dispositivo ativo**: Confirmações de entrega/leitura (ticks cinzas/azuis) não são
        enviadas nem recebidas

        - **Impacto**: Eventos `message_update` com status de entrega podem não ser recebidos

        - **Solução**: Se precisar das confirmações, mantenha WhatsApp Web ou aplicativo móvel ativo ou use presence
        "available" 


        Exemplo de requisição:

        ```json

        {
          "presence": "available"
        }

        ```


        Exemplo de resposta:

        ```json

        {
          "response": "Presence updated successfully"
        }

        ```


        Erros comuns:

        - 401: Token inválido ou expirado

        - 400: Valor de presença inválido

        - 500: Erro ao atualizar presença
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                presence:
                  type: string
                  description: Status de presença da conta atualmente conectada
                  enum:
                    - available
                    - unavailable
                  example: available
              required:
                - presence
      responses:
        '200':
          description: Presença atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Mensagem de confirmação
                    example: Presence updated successfully
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrição do erro
                    examples:
                      - Invalid payload
                      - Invalid presence value, use available or unavailable
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrição do erro de autenticação
                    example: client not found
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Descrição do erro interno
                    example: No session
  /send/text:
    post:
      operationId: sendText
      tags:
        - Enviar Mensagem
      summary: Enviar mensagem de texto
      description: >
        Envia uma mensagem de texto para um contato, grupo ou canal/newsletter.


        ## Recursos Específicos


        - **Preview de links** com suporte a personalização automática ou customizada

        - **Formatação básica** do texto

        - **Substituição automática de placeholders** dinâmicos


        ## Envio para Newsletter


        Para enviar texto para um canal, use o mesmo campo `number`, mas informe o JID completo do canal:

        - Exemplo: `120363123456789012@newsletter`


        ```json

        {
          "number": "120363123456789012@newsletter",
          "text": "Post publicado no canal"
        }

        ```


        ## Responder enquete, lista ou botão


        Use este mesmo endpoint para responder uma mensagem interativa que esteja

        salva no histórico local da instância. Envie:


        - `number`: chat onde a mensagem original foi recebida ou enviada;

        - `replyid`: ID da mensagem interativa original;

        - `text`: seleção iniciada por `>`.


        O marcador `>` é obrigatório para gerar uma resposta interativa. Sem ele,

        a API envia apenas uma mensagem de texto citando a original.


        ### Responder uma enquete


        Use a posição da opção, começando em 1. Nesta documentação pública,

        responda somente uma opção por requisição.


        ```json

        {
          "number": "5511999999999",
          "replyid": "3EB0ID_DA_ENQUETE",
          "text": ">1"
        }

        ```


        ### Responder uma lista


        Prefira o `rowId` configurado ao criar a lista. Também são aceitos o texto

        exato do item ou sua posição (`>1`).


        ```json

        {
          "number": "5511999999999",
          "replyid": "3EB0ID_DA_LISTA",
          "text": ">plano_pro"
        }

        ```


        ### Responder um botão


        Prefira o ID do botão de resposta rápida. Também são aceitos o texto exato

        exibido ou sua posição (`>1`). Isso vale para botões rápidos legados,

        templates, native flow e carrossel. Botões de URL, ligação ou cópia executam

        a própria ação e não são respondidos por este fluxo.


        ```json

        {
          "number": "5511999999999",
          "replyid": "3EB0ID_DOS_BOTOES",
          "text": ">confirmar"
        }

        ```


        A API devolve erro quando a mensagem original não está disponível ou a

        opção informada não existe.


        ## Campos Comuns


        Este endpoint suporta todos os **campos opcionais comuns** documentados na tag **"Enviar Mensagem"**, incluindo:

        `delay`, `readchat`, `readmessages`, `replyid`, `mentions`, `forward`, `track_source`, `track_id`, placeholders
        e envio para grupos.


        ## Preview de Links


        ### Preview Automático

        ```json

        {
          "number": "5511999999999",
          "text": "Confira: https://exemplo.com",
          "linkPreview": true
        }

        ```


        ### Preview Personalizado

        ```json

        {
          "number": "5511999999999",
          "text": "Confira nosso site! https://exemplo.com",
          "linkPreview": true,
          "linkPreviewTitle": "Título Personalizado",
          "linkPreviewDescription": "Uma descrição personalizada do link",
          "linkPreviewImage": "https://exemplo.com/imagem.jpg",
          "linkPreviewLarge": true
        }

        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: >-
                    ID do chat para o qual a mensagem será enviada. Pode ser um número de telefone em formato
                    internacional, um ID de grupo (`@g.us`), um ID de usuário (com `@s.whatsapp.net` ou `@lid`) ou um ID
                    de canal/newsletter (`@newsletter`).
                  example: '5511999999999'
                text:
                  type: string
                  description: >-
                    Texto da mensagem. Para responder enquete, lista ou botão, use uma seleção iniciada por `>` junto
                    com `replyid`. Aceita placeholders em mensagens de texto comuns.
                  example: Olá {{name}}! Como posso ajudar?
                linkPreview:
                  type: boolean
                  description: >
                    Ativa/desativa preview de links. Se true, procura automaticamente um link no texto para gerar
                    preview.


                    Comportamento:

                    - Se apenas linkPreview=true: gera preview automático do primeiro link encontrado no texto

                    - Se fornecidos campos personalizados (title, description, image): usa os valores fornecidos

                    - Se campos personalizados parciais: combina com dados automáticos do link como fallback
                  example: true
                linkPreviewTitle:
                  type: string
                  description: Define um título personalizado para o preview do link
                  example: Título Personalizado
                linkPreviewDescription:
                  type: string
                  description: Define uma descrição personalizada para o preview do link
                  example: Descrição personalizada do link
                linkPreviewImage:
                  type: string
                  description: URL ou Base64 da imagem para usar no preview do link
                  example: https://exemplo.com/imagem.jpg
                linkPreviewLarge:
                  type: boolean
                  description: Se true, gera um preview grande com upload da imagem. Se false, gera um preview pequeno sem upload
                  example: true
                replyid:
                  type: string
                  description: >-
                    ID da mensagem original. Com `text` iniciado por `>`, gera a resposta nativa de enquete, lista ou
                    botão quando o tipo original for suportado.
                  example: 3EB0538DA65A59F6D8A251
                mentions:
                  type: string
                  description: Números para mencionar (separados por vírgula)
                  example: 5511999999999,5511888888888
                readchat:
                  type: boolean
                  description: Marca conversa como lida após envio
                  example: true
                readmessages:
                  type: boolean
                  description: Marca últimas mensagens recebidas como lidas
                  example: true
                delay:
                  type: integer
                  description: Atraso em milissegundos antes do envio, durante o atraso apacerá 'Digitando...'
                  example: 1000
                forward:
                  type: boolean
                  description: Marca a mensagem como encaminhada no WhatsApp
                  example: true
                track_source:
                  type: string
                  description: Origem do rastreamento da mensagem
                  example: chatwoot
                track_id:
                  type: string
                  description: ID para rastreamento da mensagem (aceita valores duplicados)
                  example: msg_123456789
                async:
                  type: boolean
                  description: Se true, envia a mensagem de forma assíncrona via fila interna. Útil para alto volume de mensagens.
                  example: false
              required:
                - number
                - text
            examples:
              basic:
                summary: Mensagem básica
                description: Exemplo mais simples possível
                value:
                  number: '5511999999999'
                  text: Olá! Como posso ajudar?
              withLinkPreview:
                summary: Com preview automático
                description: Preview automático de link no texto
                value:
                  number: '5511999999999'
                  text: 'Confira: https://exemplo.com'
                  linkPreview: true
              customLinkPreview:
                summary: Preview personalizado
                description: Preview com título, descrição e imagem customizados
                value:
                  number: '5511999999999'
                  text: Confira nosso site! https://exemplo.com
                  linkPreview: true
                  linkPreviewTitle: Título Personalizado
                  linkPreviewDescription: Uma descrição personalizada do link
                  linkPreviewImage: https://exemplo.com/imagem.jpg
                  linkPreviewLarge: true
              withPlaceholders:
                summary: Com placeholders
                description: Texto com placeholders nativos e um campo personalizado
                value:
                  number: '5511999999999'
                  text: 'Olá {{first_name}}! Empresa: {{lead_field01}}. Seu email {{lead_email}} está correto?'
              newsletter:
                summary: Envio para newsletter
                description: Publica uma mensagem de texto em um canal usando o JID completo `@newsletter`.
                value:
                  number: 120363123456789012@newsletter
                  text: Post publicado no canal
              pollReply:
                summary: Responder enquete
                description: Seleciona a opção 1 da enquete identificada por replyid.
                value:
                  number: '5511999999999'
                  replyid: 3EB0ID_DA_ENQUETE
                  text: '>1'
              listReply:
                summary: Responder lista
                description: Seleciona pelo rowId configurado no item da lista.
                value:
                  number: '5511999999999'
                  replyid: 3EB0ID_DA_LISTA
                  text: '>plano_pro'
              buttonReply:
                summary: Responder botão
                description: Seleciona pelo ID configurado no botão de resposta rápida.
                value:
                  number: '5511999999999'
                  replyid: 3EB0ID_DOS_BOTOES
                  text: '>confirmar'
      responses:
        '200':
          description: Mensagem enviada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      response:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
                          message:
                            type: string
                            example: Message sent successfully
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing number or text
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid token
        '429':
          description: Limite de requisições excedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Rate limit exceeded
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: >-
                      WhatsApp server error 463: WhatsApp reported that the currently connected account is under a
                      temporary restriction for starting new conversations, usually related to sending volume or
                      quality.
                  error_source:
                    type: string
                    example: whatsapp_server
                  provider:
                    type: string
                    example: whatsapp
                  provider_code:
                    type: integer
                    example: 463
                  error_key:
                    type: string
                    example: WHATSAPP_REACHOUT_TIMELOCK
                  message:
                    type: string
                    example: The WhatsApp server rejected this message. This was not an internal API error.
                  message_ptbr:
                    type: string
