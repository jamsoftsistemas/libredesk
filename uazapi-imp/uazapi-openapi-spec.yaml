                  message:
                    type: string
                    example: History sync request sent. Messages will be received as history sync events.
                  details:
                    type: object
                    additionalProperties: true
                    description: Metadados adicionais da operação
                    properties:
                      result_timeout_ms:
                        type: integer
                        example: 120000
                        description: Prazo para o resultado final por webhook/SSE.
                      requested_anchor_messageid:
                        type: string
                        description: Referência originalmente solicitada.
                      anchor_messageid:
                        type: string
                        description: Referência efetivamente usada.
                      anchor_replaced:
                        type: boolean
                        description: A referência apagada foi substituída por uma mensagem válida posterior.
                      reused:
                        type: boolean
                        description: >-
                          O pedido repete a referência de um pedido em andamento: a API devolve o `request_id` dele e
                          não envia outro pedido ao celular.
                      fallback_mode:
                        type: string
                        enum:
                          - try_alternates
                          - exact
                        description: Modo de envio usado (`fallbackMode`).
                      attempted_chats:
                        type: array
                        items:
                          type: string
                        description: Endereços do chat para os quais o pedido foi enviado.
                  sync:
                    type: boolean
                    description: '`true` quando a resposta esperou o resultado (`sync: true`).'
                  status:
                    type: string
                    enum:
                      - completed
                      - timeout
                      - pending
                    description: >-
                      Só no modo síncrono: resultado do pedido; `pending` quando ainda não chegou e virá pelo
                      webhook/SSE.
                  request_chat:
                    type: string
                    description: 'Só no modo síncrono: chat do pedido.'
                  has_more:
                    type:
                      - boolean
                      - 'null'
                    description: 'Só no modo síncrono: `true` há mais mensagens, `false` início da conversa, `null` não confirmado.'
                    nullable: true
                  history_access:
                    type: string
                    enum:
