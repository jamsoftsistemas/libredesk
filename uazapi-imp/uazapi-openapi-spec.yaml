                          description: Estado de bloqueio no snapshot.
                        wa_archived:
                          type: boolean
                          description: Estado de arquivamento.
                        wa_unreadCount:
                          type: integer
                          description: Quantidade de mensagens não lidas disponível.
                        wa_label:
