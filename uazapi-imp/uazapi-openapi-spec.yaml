  chats:
    post:
      summary: Atualizações de chats
      description: >-
        Acompanhe mudanças no snapshot de uma conversa: nome disponível, contadores, arquivamento, bloqueio e outros
        campos atualizados.


        ## Como processar


        Correlacione por `chat.wa_chatid` ou pelo ID local disponível e aplique os campos recebidos. O evento traz um
        chat, não uma listagem completa. Não recrie uma mensagem apenas porque a prévia do chat mudou.


        Snapshots podem refletir processamento posterior de uma mensagem ou atualização de metadados. Para inicialização
        e reconciliação, use `/chat/find`.
      x-status: active
      requestBody:
        required: true
        content:
