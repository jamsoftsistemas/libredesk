        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '429':
          description: Limite de chamadas da instância ou de consultas simultâneas desta rota
          headers:
            Retry-After:
              description: Segundos até a próxima chamada ser aceita.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: rate limit exceeded
        '500':
          description: Erro interno do servidor ou sessão não iniciada
