webhooks:
  connection:
    post:
      summary: Conexão da instância
      description: >-
        Acompanhe mudanças do ciclo de conexão da instância. Use `instance.status` para atualizar a interface e decidir
        quando consultar `/instance/status`.


        ## Quando é enviado


        Conexão estabelecida e transições de desconexão notificadas pelo ciclo da sessão. Uma queda transitória de
        socket pode ser suprimida durante recuperação; não conte com um webhook para cada tentativa interna de
        reconexão.


        ## Como interpretar


        - `event_id` identifica a notificação produzida pelo fluxo de conexão.

        - `instance.status` descreve o estado informado; `lastDisconnectReason` ajuda no diagnóstico.

        - `type`, quando presente, pode indicar a origem da transição, como `Disconnected` ou `TemporaryBan`.

        - Campos como `temporaryBan` só aparecem quando aplicáveis. Consulte o estado atual se eventos chegarem
        atrasados.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: connection
                      description: Nome exato para inscrição e identificação deste evento.
                    event_id:
                      type: string
                      description: Identificador da notificação de conexão; não é um campo universal dos outros eventos.
                    instance:
                      type: object
                      description: Estado da instância.
                      properties:
                        name:
                          type: string
                          description: Nome da instância.
                        status:
                          type: string
                          description: Estado da conexão informado pelo evento.
                        lastDisconnectReason:
                          type: string
                          description: Motivo disponível da desconexão; pode ser unknown.
                        lastDisconnect:
                          type: string
                          description: Data textual da última desconexão.
                      additionalProperties: true
                    type:
                      type: string
                      description: Origem/tipo da transição, quando disponível.
                  additionalProperties: true
            examples:
              connected:
                summary: Conexão estabelecida
                value:
                  EventType: connection
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  event_id: f51310de-8e2b-4ef5-8065-dcd67e764c65
                  instance:
                    name: Atendimento
                    status: connected
              disconnected:
                summary: Desconexão notificada
                value:
                  EventType: connection
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  event_id: 4d42a099-7921-43ec-9774-da72901bbf13
                  type: Disconnected
                  instance:
                    name: Atendimento
                    status: disconnected
                    lastDisconnectReason: unknown
                    lastDisconnect: '2026-09-08 12:00:00.000Z'
      responses:
        '200':
          description: >-
            Seu receptor aceitou o evento. A resposta deve ser rápida; processe trabalho demorado depois de persistir o
            recebimento.
  history:
    post:
      summary: Sincronização de histórico
      description: >
        Receba lotes de dados processados durante sincronizações e recuperações de histórico.


        ## Variações do payload


        `EventType` permanece `history`. O campo `event` identifica o conteúdo do lote: por exemplo `messages`, `chats`,
        `calls`, `labels` ou `chat_labels`. Leia o array correspondente; não suponha que todos os arrays existam no
        mesmo evento.


        Sincronizações de etiquetas podem acrescentar `history_type`, `full_sync`, `summary` e `chunk`. Esses metadados
        não são universais para todo histórico.


        ## Identificação da origem


        `request_id` identifica de onde o lote veio. No histórico enviado após ler o QR code ou o código de pareamento,
        todos os lotes (inclusive o `status` de conclusão) trazem o mesmo `request_id`, gerado a cada pareamento e
        devolvido em `POST /instance/connect` antes da leitura do código e também informado em `GET
        /instance/history-sync/status`. Em `POST /labels/refresh`, os lotes `labels` e `chat_labels` trazem o
        `request_id` devolvido na resposta da requisição. Nas respostas de `POST /message/history-sync`, o `request_id`
        do pedido vem em cada mensagem e no topo dos lotes `messages` e `chats` quando todo o lote pertence ao mesmo
        pedido; lotes mistos podem omiti-lo no topo.


        ## Resultado de `POST /message/history-sync`


        Cada pedido termina com um único lote `event: "status"` com o `request_id` do pedido e os campos `status`,
        `has_more`, `history_access`, `received_messages` e `next_request`. Reenvie `next_request` para pedir as
        mensagens anteriores; `null` indica que não há uma próxima requisição utilizável; isso só comprova o início da
        conversa quando `has_more` é `false`. `has_more: false` indica o início da conversa; `null` indica que não foi
        confirmado. Mensagens que chegarem depois de um `timeout`, até cerca de 5 minutos após o pedido, vêm com o mesmo
        `request_id`, sem novo `status`; depois disso chegam sem `request_id`.


        ## Conversas individuais e LID


        Em conversas individuais, `chatid` vem pelo número da conversa (`@s.whatsapp.net`), mesmo quando o celular
        devolve o histórico pelo LID; o LID fica em `chatlid`. Assim as mensagens recuperadas aparecem em `POST
        /message/find` pela mesma conversa das mensagens ao vivo.


        ## Como processar


        Faça upsert pelos IDs, aceite vários lotes e tolere sobreposição com eventos ao vivo. O recebimento de um lote
        não comprova que todo o histórico do WhatsApp foi sincronizado. Quando `chunk.has_more` existir, ele descreve
        aquela sequência de chunks.


        ## Sequências e conclusão


        Cada origem de lotes recebe um `batchChunkOrder`: o histórico inicial, cada parte que o WhatsApp envia depois
        dele e cada resposta de `POST /message/history-sync`. Chats, mensagens e ligações da mesma origem compartilham o
        número. Identifique uma sequência por `batchChunkOrder` + `event` e acompanhe seus lotes com `batchNumber` e
        `batchTotal`. Lotes de sequências diferentes podem chegar intercalados.


        Lotes com dados chegam com `batchHistoryStatus: "loading"`. O fim é informado por um lote sem dados, com `event:
        "status"` e `batchHistoryStatus: "complete"`; seu `batchChunkOrder` é o da última sequência enviada. No
        histórico do pareamento, ele sai quando o WhatsApp indica o fim da sincronização completa ou após cerca de 2
        minutos sem novas partes do histórico. Se partes atrasadas chegarem depois, um novo `complete` é enviado:
        considere o de maior `batchChunkOrder`. A numeração recomeça em 1 a cada pareamento.


        Um novo pareamento pode reenviar mensagens já recebidas. Deduplique por `messageid` e faça upsert pelos IDs:
        lotes também podem se sobrepor a eventos recebidos ao vivo.


        Nos pedidos manuais, o `status` final tem uma sequência própria e `batchHistoryStatus: "complete"`, inclusive
        quando `status: "timeout"`. Esse marcador encerra o pedido; só `has_more: false` confirma o início da conversa.
        `completed` aguarda o processamento dos chunks em andamento do chat. Um timeout pode ser parcial, e mensagens
        atrasadas ainda podem chegar. O status manual é um lote único, com `batchNumber: 1` e `batchTotal: 1`. Com
        `fallbackMode: "try_alternates"`, o celular pode responder igual ao pedido pelo número e ao pedido pelo LID; a
        resposta repetida é descartada e não reenvia chats nem mensagens. Uma resposta com mensagens novas ainda pode
        chegar depois do `status`, com o mesmo `request_id`.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: history
