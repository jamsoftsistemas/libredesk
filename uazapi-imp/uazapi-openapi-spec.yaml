  messages_update:
    post:
      summary: Entrega e leitura
      description: >-
        Acompanhe atualizações de estado de mensagens, como recibos de entrega e leitura.


        ## Como correlacionar


        `event.MessageIDs` pode conter vários IDs. Aplique o estado recebido a cada mensagem correspondente da mesma
        instância/conversa. Não trate o evento como uma mensagem nova.


        A grafia dos campos é relevante: `MessageIDs`, `Timestamp`, `Type`, `IsFromMe` e `IsGroup` usam maiúsculas. Os
        campos normalizados `chatid`, `sender_pn` e `sender_lid` usam minúsculas.


        `event.Timestamp` do fluxo de recibos usa segundos Unix. Isso é diferente de `message.messageTimestamp`, que usa
        milissegundos. Eventos podem chegar fora da ordem esperada; preserve sua regra de progressão de estado.


        ## Grupos


        Em grupos, cada participante confirma separadamente. Em vez de um evento por participante, a API junta as
        confirmações de cada mensagem durante 60 segundos (contados da primeira, sem renovar) e envia um
        `messages_update` com `type: "GroupReceipts"`:


        - um evento por mensagem: `MessageIDs` tem sempre um item;

        - `event.Receipts` lista quem confirmou, o estado (`Delivered`, `Read` ou `Played`) e o horário de cada um;

        - não há `state`, `Sender` nem `Timestamp` únicos: leia cada item de `Receipts`;

        - confirmações que chegam depois da janela saem num próximo evento da mesma mensagem;

        - `IsGroup` é `true`: quem usa o filtro `isGroupYes` não recebe esses eventos.


        Confira `type` antes de processar: `ReadReceipt` para conversas individuais, `GroupReceipts` para grupos. O
        conjunto completo de confirmações de uma mensagem pode ser consultado em `POST /message/status`. O status da
        mensagem de grupo não muda com confirmações individuais.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: messages_update
                      description: Nome exato para inscrição e identificação deste evento.
                    type:
                      type: string
                      description: >-
                        Origem do evento: `ReadReceipt` nas conversas individuais; `GroupReceipts` no lote de
                        confirmações de uma mensagem de grupo.
                    state:
                      type: string
                      description: Estado normalizado aplicado às mensagens (`ReadReceipt`). Ausente em `GroupReceipts`.
                    event:
                      type: object
                      description: Recibo e mensagens afetadas.
                      properties:
                        chatid:
                          type: string
                          description: JID da conversa, quando resolvido.
                        chatlid:
                          type:
                            - string
                            - 'null'
                          description: LID da conversa; pode ser ausente ou null.
                        sender_pn:
                          type:
                            - string
                            - 'null'
                          description: JID por telefone, quando conhecido.
                        sender_lid:
                          type:
                            - string
                            - 'null'
                          description: Identificador LID, quando conhecido.
                        Chat:
                          type: string
                          description: JID da conversa.
                        Sender:
                          type: string
                          description: JID do emissor do recibo. Ausente em `GroupReceipts`.
                        MessageIDs:
                          type:
                            - array
                            - 'null'
                          description: Mensagens afetadas. Em `GroupReceipts`, sempre uma.
                          items:
                            type: string
                        Timestamp:
                          type: integer
                          description: >-
                            Segundos Unix no fluxo de recibos. Ausente em `GroupReceipts`; use o `timestamp` de cada
                            item.
                        Type:
                          type: string
                          description: Estado do recibo; `GroupReceipts` no lote de grupo.
                        IsFromMe:
                          type: boolean
                          description: Origem da mensagem.
                        IsGroup:
                          type: boolean
                          description: Conversa de grupo.
                        Receipts:
                          type: array
                          description: 'Só em `GroupReceipts`: confirmações dos participantes nesta janela, em ordem de horário.'
                          items:
                            $ref: '#/components/schemas/MessageReceipt'
                      additionalProperties: true
                  additionalProperties: true
            examples:
              read:
                summary: Recibo de leitura
                value:
                  EventType: messages_update
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  type: ReadReceipt
                  state: Read
                  event:
                    Chat: 5511888888888@s.whatsapp.net
                    chatid: 5511888888888@s.whatsapp.net
                    chatlid: null
                    Sender: 5511888888888@s.whatsapp.net
                    sender_pn: 5511888888888@s.whatsapp.net
                    sender_lid: null
                    MessageIDs:
                      - MSG_EXEMPLO
                    Timestamp: 1788868800
                    Type: Read
                    IsFromMe: true
                    IsGroup: false
              group_receipts:
                summary: Confirmações de grupo (GroupReceipts)
                value:
                  EventType: messages_update
                  owner: '5511999999999'
                  token: INSTANCE_TOKEN
                  BaseUrl: https://seu-servidor.example
                  instanceName: Atendimento
                  type: GroupReceipts
                  event:
                    Chat: 120363000000001@g.us
                    chatid: 120363000000001@g.us
                    IsFromMe: false
                    IsGroup: true
                    MessageIDs:
                      - MSG_EXEMPLO
                    Type: GroupReceipts
                    Receipts:
                      - participant: 5511911110000@s.whatsapp.net
                        participant_pn: 5511911110000@s.whatsapp.net
                        participant_lid: 300001@lid
                        state: Delivered
                        timestamp: 1788868801
                      - participant: 5511922220000@s.whatsapp.net
                        participant_pn: 5511922220000@s.whatsapp.net
                        participant_lid: 300002@lid
                        state: Delivered
                        timestamp: 1788868803
                      - participant: 5511911110000@s.whatsapp.net
                        participant_pn: 5511911110000@s.whatsapp.net
                        participant_lid: 300001@lid
                        state: Read
                        timestamp: 1788868820
      responses:
