  /admin/token/rotate:
    post:
      operationId: rotateAdminToken
      tags:
        - Administração
      summary: Rotacionar admin token
      security:
        - admintoken: []
      description: |
        Gera um novo `admintoken`. Use o token atual no header e guarde o token retornado.

        Só é permitida uma rotação a cada 24 horas.
      responses:
        '200':
          description: Admin token rotacionado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - admin_token
                  - license_sync_triggered
                  - license_synced
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Admin token rotated successfully
                  admin_token:
                    type: string
                    minLength: 50
                    maxLength: 50
                    pattern: ^[A-Za-z0-9]{50}$
                    description: Novo admin token.
                    example: AbC123Def456GhI789JkL012MnO345PqR678StU901VwX234Yz
                  license_sync_triggered:
                    type: boolean
                    example: true
                  license_synced:
                    type: boolean
                    example: true
                  timestamp:
                    type: integer
                    format: int64
                    description: Timestamp Unix em milissegundos.
                    example: 1776892800000
        '401':
          description: admintoken inválido ou ausente
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '403':
          description: Rotação bloqueada para container gratuito/demo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Admin token rotation is disabled for free containers
        '429':
          description: Rotação bloqueada por cooldown de 24 horas
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - last_rotated_at
                  - next_rotation_at
                  - retry_after_ms
                properties:
                  error:
                    type: string
                    example: Admin token rotation cooldown active
                  last_rotated_at:
                    type: integer
                    format: int64
                    description: Timestamp Unix em milissegundos da última rotação concluída.
                    example: 1776892800000
                  next_rotation_at:
                    type: integer
                    format: int64
                    description: Timestamp Unix em milissegundos de quando uma nova rotação será permitida.
                    example: 1776979200000
                  retry_after_ms:
                    type: integer
                    format: int64
                    description: Tempo restante em milissegundos para liberar nova rotação.
                    example: 86400000
        '500':
          description: Erro interno ao rotacionar o token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to persist admin token
        '502':
          description: Falha ao confirmar a rotação
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - error
                  - license_synced
                  - timestamp
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Failed to sync rotated admin token with license server
                  license_synced:
                    type: boolean
                    example: false
                  timestamp:
                    type: integer
                    format: int64
                    example: 1776892800000
  /chat/avatar:
    post:
      operationId: getChatAvatar
      tags:
        - Chats
      summary: Consultar avatar de um chat
      description: |
        Retorna a URL temporária da imagem de uma conversa individual ou grupo.
        Use `preview=true` para solicitar a imagem reduzida ou `preview=false` para
        solicitar a imagem completa.

        Quando não houver imagem disponível, a resposta continua válida e retorna
        `url` vazio. `force=true` solicita uma atualização antecipada, respeitando
        um intervalo mínimo de 20 segundos por imagem e instância; não use essa
        opção em polling contínuo.
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
              properties:
                number:
                  type: string
                  minLength: 1
                  description: >-
                    Identificador do chat. Aceita número com DDI, JID de usuário, LID conhecido pela instância ou JID de
                    grupo.
                  example: '5511999999999'
                preview:
                  type: boolean
                  default: false
                  description: true solicita preview; false solicita a imagem completa.
                force:
                  type: boolean
                  default: false
                  description: >-
                    Solicita uma atualização antecipada, respeitando o intervalo mínimo de 20 segundos por imagem e
                    instância. Não use em polling contínuo.
            example:
              number: '5511999999999'
              preview: true
      responses:
        '200':
          description: URL da foto ou string vazia quando não houver imagem disponível.
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    description: URL temporária; string vazia é válida.
              examples:
                found:
                  value:
                    url: https://pps.whatsapp.net/example.jpg
                absent:
                  value:
                    url: ''
        '400':
          description: Payload inválido, number ausente ou identificador inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Falha ao consultar a imagem ou ausência de sessão disponível.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /business/catalog/save:
    post:
      operationId: postBusinessCatalogSave
      tags:
        - Business
      summary: Criar ou editar um produto do catálogo
      description: |
        Cria um produto quando `id` não é informado ou atualiza o produto indicado.
        Os preços são strings de inteiros em milésimos da moeda (por exemplo,
        `19990` = R$ 19,99). Envie `image_data` em base64 ou Data URL, ou uma
        `image_url` pública HTTPS para uma imagem nova. Para manter imagens já
        cadastradas, envie suas URLs em `image_urls`. Uma dessas três fontes
        de imagem é obrigatória.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                id:
                  type: string
                  description: Omitir para criar; informar para editar
                name:
                  type: string
                  maxLength: 256
                description:
                  type: string
                  maxLength: 4096
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  example: BRL
                price:
                  type: string
                  pattern: ^\d{1,18}$
                  description: Preço em milésimos da moeda
                  example: '19990'
                sale_price:
                  type: string
                  pattern: ^\d{1,18}$
                  description: Preço promocional em milésimos da moeda
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                retailer_id:
                  type: string
                  maxLength: 256
                is_hidden:
                  type: boolean
                  default: false
                image_urls:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                  description: URLs HTTPS de mídia retornadas pelo WhatsApp/Meta; não aceita hosts arbitrários.
                video_urls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                  description: URLs de vídeos já associados ao produto
                image_data:
                  type: string
                  description: Imagem JPEG ou PNG em base64 ou Data URL, com até 16 MB.
                image_url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: URL pública HTTPS de uma imagem JPEG ou PNG, com até 16 MB
                compliance_category:
                  type: string
                  maxLength: 128
                compliance_info:
                  $ref: '#/components/schemas/BusinessComplianceInfo'
                width:
                  type: integer
                  minimum: 1
                  maximum: 1024
                height:
                  type: integer
                  minimum: 1
                  maximum: 1024
      responses:
        '200':
          description: Produto atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    $ref: '#/components/schemas/BusinessProduct'
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    $ref: '#/components/schemas/BusinessProduct'
        '400':
          description: Produto inválido
        '401':
          description: Token inválido
        '500':
          description: Erro ao carregar a imagem ou salvar o produto
  /send/event:
    post:
      operationId: sendEvent
      tags:
        - Enviar Mensagem
      summary: Enviar evento
      description: |
        Envia um convite de evento para um contato ou grupo. Informe `startTime`
        em segundos ou milissegundos Unix; `endTime` é opcional. Uma resposta do
        convidado chega como mensagem do tipo `EventResponseMessage`, com a
        escolha em `vote`.

        Aceita os campos comuns de envio: `replyid`, `mentions`, `delay`,
        `readchat`, `readmessages`, `async`, `track_source` e `track_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
                - name
                - startTime
              properties:
                number:
                  type: string
                name:
                  type: string
                description:
                  type: string
                startTime:
                  type: integer
                  format: int64
                  description: Início em segundos ou milissegundos Unix.
                endTime:
                  type: integer
                  format: int64
                  description: Fim em segundos ou milissegundos Unix; não pode preceder o início.
                location:
                  type: object
                  properties:
                    name:
                      type: string
                    address:
                      type: string
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                joinLink:
                  type: string
                  format: uri
                  description: Link HTTPS obrigatório se `isScheduleCall=true`.
                extraGuestsAllowed:
                  type: boolean
                isScheduleCall:
                  type: boolean
                isCanceled:
                  type: boolean
                hasReminder:
                  type: boolean
                reminderOffsetSec:
                  type: integer
                  format: int64
                  minimum: 0
                replyid:
                  type: string
                mentions:
                  type: string
                delay:
                  type: integer
                readchat:
                  type: boolean
                readmessages:
                  type: boolean
                async:
                  type: boolean
                track_source:
                  type: string
                track_id:
                  type: string
            example:
              number: '5511999999999'
              name: Reunião de apresentação
              startTime: 1790186400
              endTime: 1790190000
      responses:
        '200':
          description: Convite enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Evento inválido
        '401':
          description: Token inválido
        '500':
          description: Falha no envio
  /send/group-invite:
    post:
      operationId: sendGroupInvite
      tags:
        - Enviar Mensagem
      summary: Enviar convite de grupo
      description: |
        Envia o cartão de convite para grupo (`GroupInviteMessage`), o mesmo que o
        WhatsApp oferece quando não consegue adicionar alguém por causa da
        privacidade. Quem recebe vê o nome do grupo e o botão para entrar.

        O `code` e a `expiration` vêm de `POST /group/updateParticipants` com
        `action: add`: quando a privacidade da pessoa bloqueia a adição, o item
        dela em `groupUpdated` traz `Error: 403` e `AddRequest` com `Code` e
        `Expiration`. O código vale só para essa pessoa e expira em cerca de 3
        dias. Se a pessoa for adicionada direto (`Error: 0`), não há convite.

        O nome do grupo é preenchido pela API. Código já expirado é recusado.

        Aceita os campos comuns de envio: `replyid`, `mentions`, `delay`,
        `readchat`, `readmessages`, `async`, `track_source` e `track_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
                - groupjid
                - code
                - expiration
              properties:
                number:
                  type: string
                  description: Quem recebe o convite.
                groupjid:
                  type: string
                  description: JID do grupo (`@g.us`).
                code:
                  type: string
                  description: >-
                    `AddRequest.Code` da resposta de `/group/updateParticipants`. Aceita também o link inteiro
                    (`https://chat.whatsapp.com/<code>`); a API guarda só o código.
                expiration:
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
                  description: |
                    `AddRequest.Expiration` da resposta de `/group/updateParticipants`.
                    Aceita o texto RFC3339 como vem lá ou Unix em segundos ou milissegundos.
                text:
                  type: string
                  description: Legenda abaixo do cartão.
                replyid:
                  type: string
                mentions:
                  type: string
                delay:
                  type: integer
                readchat:
                  type: boolean
                readmessages:
                  type: boolean
                async:
                  type: boolean
                track_source:
                  type: string
                track_id:
                  type: string
            example:
              number: '5511999999999'
              groupjid: 120363028782550019@g.us
              code: EMVH7xMeLQRQcZQg
              expiration: '2026-10-05T15:38:19Z'
              text: Convite para participar do meu grupo no WhatsApp
      responses:
        '200':
          description: Convite enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Campos ausentes, `groupjid` inválido ou código expirado
        '401':
          description: Token inválido
        '500':
          description: Falha no envio
  /business/catalog/collection/list:
