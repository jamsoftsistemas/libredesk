  /newsletter/updates:
    post:
      operationId: getNewsletterMessageUpdates
      tags:
        - Newsletters e Canais
      summary: Buscar updates de mensagens de um canal
      deprecated: true
      description: >
        **Obsoleta.** O WhatsApp não responde à consulta de updates (`message_updates`): a API desiste em 10 segundos e
        responde 504.


        Para views e reações dos posts, use `POST /newsletter/messages`, que traz `viewsCount` e `reactionCounts` em
        cada post.


        Parâmetros mantidos por compatibilidade:

        - `afterid` filtra updates depois de um `serverid`

        - `since` filtra pelo momento do update, em segundos ou milissegundos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jid
              properties:
                jid:
                  type: string
                  description: >-
                    JID do canal. Aceita o formato completo `120363123456789012@newsletter` ou apenas o identificador
                    numérico.
                  example: 120363123456789012@newsletter
                count:
                  type: integer
                  minimum: 1
                  description: Quantidade máxima de updates retornados.
                  example: 50
                afterid:
                  type: integer
                  minimum: 1
                  description: Retorna apenas updates posteriores ao `serverid` informado.
                  example: 12345
                since:
                  type: integer
                  description: |
                    Timestamp de corte.
                    - Se maior que `1000000000000`, é interpretado como milissegundos.
                    - Caso contrário, é interpretado como segundos.
                  example: 1710000000
            examples:
              por_after_id:
                summary: Buscar updates depois de um post conhecido
                value:
                  jid: 120363123456789012@newsletter
                  count: 50
                  afterid: 12345
              por_since:
                summary: Buscar updates a partir de um timestamp
                value:
                  jid: 120363123456789012@newsletter
                  count: 50
                  since: 1710000000
      responses:
        '200':
          description: Updates de mensagens do canal recuperados com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    type: array
                    description: Lista de updates de mensagens do canal.
                    items:
                      type: object
                      properties:
                        serverid:
                          type: integer
                          description: Identificador do post no canal.
                          example: 12345
                        messageid:
                          type: string
                          description: ID lógico da mensagem.
                          example: 3EB0B4302B3A8A52F7A1
                        type:
                          type: string
                          description: Tipo da mensagem do canal.
                          example: text
                        timestamp:
                          type: string
                          format: date-time
                          description: Momento associado ao update retornado.
                        viewsCount:
                          type: integer
                          description: Quantidade atualizada de visualizações.
                          example: 1540
                        reactionCounts:
                          type: object
                          additionalProperties:
                            type: integer
                          description: Mapa atualizado de emoji para quantidade de reações.
                          example:
                            👍: 35
                            🔥: 11
                        message:
                          type: object
                          description: |
                            Conteúdo bruto da mensagem, quando presente.
                            Em muitos live updates esse campo pode vir ausente.
                          additionalProperties: true
              examples:
                sucesso:
                  value:
                    response:
                      - messageid: 3EB0B4302B3A8A52F7A1
                        serverid: 12345
                        type: text
                        timestamp: '2026-03-24T19:00:00Z'
                        viewsCount: 1540
                        reactionCounts:
                          👍: 35
                          🔥: 11
        '400':
          description: Payload inválido ou JID do canal inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid newsletter jid
        '401':
          description: Instância não autenticada ou cliente não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: client not found
        '500':
          description: Erro interno ao consultar updates do canal no WhatsApp
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: connection closed
        '504':
          description: O WhatsApp não respondeu à consulta de updates em 10 segundos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: WhatsApp did not answer the message updates request
