  /send/request-payment:
    post:
      operationId: sendRequestPayment
      tags:
        - Enviar Mensagem
      summary: Solicitar pagamento
      description: |
        Envia uma solicitação de pagamento com o botão nativo **"Revisar e pagar"** do WhatsApp.
        O fluxo suporta PIX (estático, dinâmico ou desabilitado), boleto, link de pagamento e cartão,
        combinando tudo em uma única mensagem interativa.

        ## Como funciona
        - Define o valor em `amount` (BRL por padrão) e opcionalmente personaliza título, texto e nota adicional.
        - Por padrão exige `pixKey`.
        - O arquivo apontado por `fileUrl` é anexado como documento (boleto ou fatura em PDF, por exemplo).
        - `paymentLink` habilita o botão externo.
        - Para cobrar um pedido recebido pelo WhatsApp, informe `orderMessageId`
          com o ID da mensagem `OrderMessage` desse mesmo contato. A API obtém
          itens, moeda e total do pedido; `amount` não é necessário nesse caso.
          Ainda é preciso informar um método de pagamento.



        ## Campos comuns
        Este endpoint também suporta os campos padrão: `delay`, `readchat`, `readmessages`, `replyid`,
        `mentions`, `track_source`, `track_id` e `async`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: >-
                    ID do chat para o qual a mensagem será enviada. Pode ser um número de telefone em formato
                    internacional, um ID de grupo (`@g.us`), um ID de usuário (com `@s.whatsapp.net` ou `@lid`).
                  example: '5511999999999'
                orderMessageId:
                  type: string
                  description: ID de uma `OrderMessage` recebida do mesmo contato. Vincula a cobrança ao pedido real.
                title:
                  type: string
                  description: Título que aparece no cabeçalho do fluxo
                  example: Detalhes do pedido
                text:
                  type: string
                  description: Mensagem exibida no corpo do fluxo
                  example: 'Pedido #123 pronto para pagamento'
                footer:
                  type: string
                  description: Texto do rodapé da mensagem
                  example: Loja Exemplo
                itemName:
                  type: string
                  description: Nome do item principal listado no fluxo
                  example: Assinatura Plano Ouro
                invoiceNumber:
                  type: string
                  description: Identificador ou número da fatura
                  example: PED-123
                amount:
                  type: number
                  format: float
                  description: Valor da cobrança (em BRL por padrão)
                  example: 199.9
                pixKey:
                  type: string
                  description: Chave PIX estático (CPF/CNPJ/telefone/email/EVP)
                  example: 123e4567-e89b-12d3-a456-426614174000
                pixType:
                  type: string
                  description: Tipo da chave PIX (`CPF`, `CNPJ`, `PHONE`, `EMAIL`, `EVP`). Padrão `EVP`
                  example: EVP
                pixName:
                  type: string
                  description: Nome do recebedor exibido no fluxo (padrão usa o nome do perfil da instância)
                  example: Loja Exemplo
                paymentLink:
                  type: string
                  description: URL externa para checkout (somente dominios homologados; veja lista acima)
                  example: https://pagamentos.exemplo.com/checkout/abc
                fileUrl:
                  type: string
                  description: 'URL ou caminho (base64) do documento a ser anexado (ex.: boleto PDF)'
                  example: https://cdn.exemplo.com/boleto-123.pdf
                fileName:
                  type: string
                  description: Nome do arquivo exibido no WhatsApp ao anexar `fileUrl`
                  example: boleto-123.pdf
                boletoCode:
                  type: string
                  description: Linha digitável do boleto (habilita o método boleto automaticamente)
                  example: 34191.79001 01043.510047 91020.150008 5 91070026000
                replyid:
                  type: string
                  description: ID da mensagem que será respondida
                mentions:
                  type: string
                  description: Números mencionados separados por vírgula
                delay:
                  type: integer
                  description: Atraso em milissegundos antes do envio (exibe "digitando..." no WhatsApp)
                readchat:
                  type: boolean
                  description: Marca o chat como lido após enviar a mensagem
                readmessages:
                  type: boolean
                  description: Marca mensagens recentes como lidas após o envio
                async:
                  type: boolean
                  description: Enfileira o envio para processamento assíncrono
                track_source:
                  type: string
                  description: 'Origem de rastreamento (ex.: chatwoot, crm-interno)'
                track_id:
                  type: string
                  description: Identificador de rastreamento (aceita valores duplicados)
              required:
                - number
              anyOf:
                - required:
                    - amount
                - required:
                    - orderMessageId
            examples:
              pedidoRecebido:
                summary: Cobrar um pedido enviado pelo cliente
                value:
                  number: '5511999999999'
                  orderMessageId: 3EB0ID_DO_PEDIDO
                  pixKey: 123e4567-e89b-12d3-a456-426614174000
                  text: Confira os dados para pagamento
              pixSimples:
                summary: PIX simples
                value:
                  number: '5511999999999'
                  amount: 199.9
                  text: 'Pedido #123 pronto para pagamento'
                  pixKey: 123e4567-e89b-12d3-a456-426614174000
                  pixType: EVP
              pixEBoleto:
                summary: PIX + boleto
                value:
                  number: '5511999999999'
                  amount: 349.5
                  text: 'Pedido #457 com boleto'
                  pixKey: '12345678000190'
                  pixType: CNPJ
                  pixName: Loja Exemplo LTDA
                  boletoCode: 34191.79001 01043.510047 91020.150008 5 91070026000
                  additionalNote: Pague via PIX ou utilize o boleto em anexo
              completo:
                summary: PIX + boleto + link
                value:
                  number: '5511888888888'
                  title: Assinatura Premium
                  text: Plano anual disponível para pagamento
                  footer: footer
                  invoiceNumber: INV-789
                  itemName: Bolo XYZ
                  amount: 599
                  pixKey: 123e4567-e89b-12d3-a456-426614174000
                  pixType: EVP
                  pixName: Empresa Exemplo
                  boletoCode: 23793.38128 60000.000123 45670.000012 3 45670000012345
                  fileUrl: https://cdn.exemplo.com/boleto-inv-789.pdf
                  fileName: Clique para abrir o PDF.pdf
                  paymentLink: https://payment-link.pagar.me/checkout/inv-789
      responses:
        '200':
          description: Solicitação de pagamento enviada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      response:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
                          message:
                            type: string
                            example: Payment request sent successfully
        '400':
          description: Requisição inválida
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing pixKey or pixCode
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid token
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to send payment request
  /message/payment/status:
    post:
      operationId: updatePaymentStatus
      tags:
        - Enviar Mensagem
      summary: Atualizar pagamento e pedido
      description: |
        Envia ao cliente uma atualização de um pedido originado por
        `POST /send/request-payment`. No campo `id`, envie o `id` ou o
        `messageid` retornado pela solicitação. `paid` é opcional: quando
        omitido, somente o estado do pedido é enviado. `note` aparece na
        atualização do pedido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - status
              properties:
                id:
                  type: string
                  description: Aceita o `id` ou o `messageid` da solicitação de pagamento enviada.
                status:
                  type: string
                  description: Novo estado do pedido.
                  enum:
                    - payment_requested
                    - preparing_to_ship
                    - shipped
                    - delivered
                    - completed
                    - canceled
                paid:
                  type: boolean
                  description: '`true` confirma o pagamento; `false` marca como pendente. Omitir para não alterar.'
                note:
                  type: string
                  maxLength: 500
            examples:
              por_messageid:
                summary: Usar o messageid
                value:
                  id: 3EB012345678
                  status: shipped
                  paid: true
                  note: Seu pedido saiu para entrega.
              por_id:
                summary: Usar o id
                value:
                  id: 5511999999999:3EB012345678
                  status: shipped
      responses:
        '200':
          description: Atualização enviada
          content:
            application/json:
              schema:
                type: object
                required:
                  - referenceId
                  - orderStatus
                  - paymentChanged
                  - manual
                properties:
                  status:
                    type: string
                    description: Estado da mensagem de atualização enviada (por exemplo, `Pending`).
                  referenceId:
                    type: string
                  orderStatus:
                    type: string
                    description: Estado do pedido aplicado; não confundir com o estado da mensagem em `status`.
                  paymentChanged:
                    type: boolean
                  paymentStatusMessageID:
                    type: string
                    description: Presente quando `paid` foi informado.
                  paid:
                    type: boolean
                    description: Presente quando `paid` foi informado.
                  manual:
                    type: boolean
        '400':
          description: Campos inválidos ou mensagem original incompatível
        '401':
          description: Token inválido
        '404':
          description: Solicitação original não encontrada
        '500':
          description: Erro ao consultar a solicitação ou preparar a atualização
        '502':
          description: Falha no envio. Confira o chat antes de tentar novamente; parte da atualização pode ter sido enviada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  partial:
                    type: boolean
                    description: '`true` quando o pagamento foi atualizado, mas a mensagem do pedido não foi enviada.'
                  paymentStatusMessageID:
                    type: string
                    description: ID da atualização de pagamento já enviada, quando `partial=true`.
        '503':
          description: WhatsApp desconectado
  /send/pix-button:
