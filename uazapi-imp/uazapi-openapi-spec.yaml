            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: instance is stopping
  /instance/history-sync/status:
    get:
      operationId: getHistorySyncStatus
      security:
        - token: []
      tags:
        - Instancia
      summary: Consultar o processamento do histórico inicial
      description: |
        Retorna o diagnóstico em memória da sincronização de histórico iniciada no
        pareamento mais recente desta instância. Não inicia uma nova sincronização.

        O `request_id` é o mesmo devolvido por `POST /instance/connect` para essa
        tentativa e pelos lotes `history` do pareamento. O diagnóstico só existe após
        o pareamento: antes disso, pode retornar `diagnosis: [no_trace]`. Esse endpoint
        não acompanha os pedidos manuais de `POST /message/history-sync`; use o
        `request_id` desses pedidos nos eventos webhook/SSE.

        `deliveryStatus` pode ser `pending`, `delivered`, `partial`, `failed`,
        `no_webhook` ou `no_batches`. O progresso informado pelo WhatsApp chegar a
        100 não significa, sozinho, que todos os lotes já foram entregues.

        O rastreamento é isolado por instância, limitado aos eventos recentes e
        reiniciado junto com o processo. URLs de webhook podem aparecer no
        diagnóstico; trate a resposta como informação operacional sensível.
      responses:
        '200':
          description: Estado observado da sincronização mais recente, ou diagnóstico sem rastreamento.
          content:
            application/json:
              schema:
                type: object
                required:
                  - diagnosis
                properties:
                  request_id:
                    type: string
                    description: >-
                      Identificador do pareamento, também devolvido em POST /instance/connect e repetido nos lotes
                      history do histórico inicial. Ausente quando não há rastreamento.
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
                  processingStopped:
                    type: boolean
                  processingComplete:
                    type: boolean
                  pendingEmissions:
                    type: integer
                  totalBatches:
                    type: integer
                  deliveryStatus:
                    type: string
                    enum:
                      - pending
                      - delivered
                      - partial
                      - failed
                      - no_webhook
                      - no_batches
                  pairedAt:
                    type: string
                    format: date-time
                    nullable: true
                  diagnosis:
                    type: array
                    items:
                      type: string
                  noWebhookConfigured:
                    type: boolean
                  serializationFailures:
                    type: integer
                  received:
                    type: object
                    additionalProperties: true
                  emitted:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        batches:
                          type: integer
                        items:
                          type: integer
                  webhooks:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      properties:
                        at:
                          type: string
                          format: date-time
                        stage:
                          type: string
                        status:
                          type: string
                        detail:
                          type: string
              examples:
                sem_rastreamento:
                  value:
                    pairedAt: null
                    diagnosis:
                      - no_trace
        '401':
          description: Token da instância ausente ou inválido.
  /message/markread:
    post:
      operationId: markMessageRead
      tags:
        - Ações na mensagem e Buscar
      summary: Marcar mensagens como lidas
      description: |
        Marca uma ou mais mensagens como lidas. Este endpoint permite:
        1. Marcar múltiplas mensagens como lidas de uma vez
        2. Atualizar o status de leitura no WhatsApp
        3. Sincronizar o status de leitura entre dispositivos

        Exemplo de requisição básica:
        ```json
        {
          "id": [
            "62AD1AD844E518180227BF68DA7ED710",
            "ECB9DE48EB41F77BFA8491BFA8D6EF9B"  
          ]
        }
        ```

        Exemplo de resposta:
        ```json
        {
          "success": true,
          "message": "Messages marked as read",
          "markedMessages": [
            {
              "id": "62AD1AD844E518180227BF68DA7ED710",
              "timestamp": 1672531200000
            },
            {
              "id": "ECB9DE48EB41F77BFA8491BFA8D6EF9B",
              "timestamp": 1672531300000
            }
          ]
        }
        ```

        Parâmetros disponíveis:
        - id: Lista de IDs das mensagens a serem marcadas como lidas

        Erros comuns:
        - 401: Token inválido ou expirado
        - 400: Lista de IDs vazia ou inválida
        - 404: Uma ou mais mensagens não encontradas
        - 500: Erro ao marcar mensagens como lidas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: array
                  description: Lista de IDs das mensagens a serem marcadas como lidas
                  items:
                    type: string
                  example:
                    - 62AD1AD844E518180227BF68DA7ED710
                    - ECB9DE48EB41F77BFA8491BFA8D6EF9B
              required:
                - id
      responses:
        '200':
          description: Messages successfully marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        message_id:
                          type: string
                          description: ID of the message that was processed
                        status:
                          type: string
                          enum:
                            - success
                            - error
                          description: Status of the mark as read operation
                        error:
                          type: string
                          description: Error message if status is error
                    example:
                      - message_id: 62AD1AD844E518180227BF68DA7ED710
                        status: success
                      - message_id: ECB9DE48EB41F77BFA8491BFA8D6EF9B
                        status: error
                        error: Message not found
        '400':
          description: Invalid request payload or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing Id in Payload
        '401':
          description: Unauthorized - invalid or missing token
        '500':
          description: Server error while processing the request
  /message/react:
    post:
      operationId: reactToMessage
      tags:
        - Ações na mensagem e Buscar
      summary: Enviar reação a uma mensagem
      description: |
        Envia uma reação (emoji) a uma mensagem específica.

        Informe apenas `id` e `text`. O chat e o autor da mensagem alvo são obtidos
        da mensagem salva na instância. O campo legado `number` é opcional e ignorado.

        Este endpoint permite:

        1. Adicionar ou remover reações em mensagens

        2. Usar qualquer emoji Unicode válido

        3. Reagir a mensagens em chats individuais ou grupos

        4. Remover reações existentes

        5. Verificar o status da reação enviada


        Tipos de reações suportados:

        - Qualquer emoji Unicode válido (👍, ❤️, 😂, etc)

        - String vazia para remover reação


        Exemplo de requisição básica:

        ```json

        {
          "text": "👍",
          "id": "3EB0538DA65A59F6D8A251"
        }

        ```


        Exemplo de requisição para remover reação:

        ```json

        {
          "text": "",
          "id": "3EB0538DA65A59F6D8A251"
        }

        ```


        Exemplo de resposta:

        ```json

        {
          "success": true,
          "message": "Reaction sent",
          "reaction": {
            "id": "3EB0538DA65A59F6D8A251",
            "emoji": "👍",
            "timestamp": 1672531200000,
            "status": "sent"
          }
        }

        ```


        Exemplo de resposta ao remover reação:

        ```json

        {
          "success": true,
          "message": "Reaction removed",
          "reaction": {
            "id": "3EB0538DA65A59F6D8A251",
            "emoji": null,
            "timestamp": 1672531200000,
            "status": "removed"
          }
        }

        ```


        Parâmetros disponíveis:

        - text: Emoji Unicode da reação (ou string vazia para remover reação)

        - id: ID da mensagem que receberá a reação


        Erros comuns:

        - 401: Token inválido ou expirado

        - 400: ID ausente ou dados inválidos

        - 404: Mensagem não encontrada

        - 500: Erro ao enviar reação


        Limitações:

        - Só é possível reagir a mensagens enviadas por outros usuários

        - Não é possível reagir a mensagens antigas (mais de 7 dias)

        - O mesmo usuário só pode ter uma reação ativa por mensagem
      requestBody:
        required: true
        content:
          application/json:
            examples:
              react:
                summary: Adicionar uma reação
                value:
                  id: 3EB0538DA65A59F6D8A251
                  text: 👍
              remove:
                summary: Remover a reação
                value:
                  id: 3EB0538DA65A59F6D8A251
                  text: ''
            schema:
              type: object
              properties:
                number:
                  type: string
                  deprecated: true
                  description: Campo legado opcional e ignorado. O chat é obtido da mensagem identificada por id.
                text:
                  type: string
                  description: Emoji Unicode da reação (ou string vazia para remover reação)
                  example: 👍
                id:
                  type: string
                  description: ID da mensagem que receberá a reação
                  example: 3EB0538DA65A59F6D8A251
              required:
                - text
                - id
      responses:
        '200':
          description: Reação enviada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID único da mensagem de reação
                    example: owner:generated_message_id
                  messageid:
                    type: string
                    description: ID gerado para a mensagem de reação
                    example: generated_message_id
                  content:
                    type: object
                    description: Detalhes da reação
                  messageTimestamp:
                    type: number
                    description: Timestamp da mensagem em milissegundos
                    example: 1672531200000
                  messageType:
                    type: string
                    description: Tipo da mensagem
                    example: reaction
                  status:
                    type: string
                    description: Status atual da mensagem
                    example: Pending
                  owner:
                    type: string
                    description: Proprietário da instância
                    example: instance_owner
        '400':
          description: Erro nos dados da requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing Id in Payload
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '404':
          description: Mensagem não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message not found
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Error sending message
  /message/delete:
    post:
      operationId: deleteMessage
      tags:
        - Ações na mensagem e Buscar
      summary: Apagar Mensagem Para Todos
      description: |
        Apaga uma mensagem para todos os participantes da conversa.

        ### Funcionalidades:
        - Apaga mensagens em conversas individuais ou grupos
        - Funciona com mensagens enviadas pelo usuário ou recebidas
        - Atualiza o status no histórico da instância
        - Envia webhook de atualização

        **Notas Técnicas**:
        1. O ID da mensagem pode ser fornecido em dois formatos:
           - ID completo (contém ":"): usado diretamente
           - ID curto: associado automaticamente à instância autenticada
        2. Gera evento webhook do tipo "messages_update"
        3. Atualiza o status da mensagem para "Deleted"
        4. Para newsletters/canais, use `POST /newsletter/messages/delete`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID da mensagem a ser apagada
              required:
                - id
      responses:
        '200':
          description: Mensagem apagada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  id:
                    type: string
        '400':
          description: Payload inválido ou ID de chat/sender inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid payload
        '401':
          description: Token não fornecido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Mensagem não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: message not found
        '500':
          description: Erro interno do servidor ou sessão não iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
  /message/edit:
    post:
      operationId: editMessage
      tags:
        - Ações na mensagem e Buscar
      summary: Edita uma mensagem enviada
      description: |
        Edita o conteúdo de uma mensagem já enviada usando a funcionalidade nativa do WhatsApp.

        Use esta operação para corrigir o texto de uma mensagem enviada pela própria
        instância. A resposta retorna a mensagem atualizada e a alteração também
        aparece nos eventos configurados.

        **Importante**:
        - Só é possível editar mensagens enviadas pela própria instância
        - A mensagem precisa estar disponível no histórico da instância
        - O ID pode ser fornecido no formato completo retornado pela API ou apenas como `messageid`
        - A mensagem deve estar dentro do prazo permitido pelo WhatsApp para edição
        - Para newsletters/canais, use `POST /newsletter/messages/edit`
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - text
              properties:
                id:
                  type: string
                  description: ID completo retornado pela API ou apenas o messageid
                  example: 3A12345678901234567890123456789012
                text:
                  type: string
                  description: Novo conteúdo de texto da mensagem
                  example: Texto editado da mensagem
      responses:
        '200':
          description: Mensagem editada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID completo da mensagem retornado pela API
                    example: 5511999999999:3A12345678901234567890123456789012
                  messageid:
                    type: string
                    description: ID da mensagem no WhatsApp
                    example: 3A12345678901234567890123456789012
                  content:
                    type: string
                    description: Conteúdo da mensagem editada
                    example: Texto editado da mensagem
                  messageTimestamp:
                    type: integer
                    description: Timestamp da mensagem (Unix timestamp em milissegundos)
                    example: 1704067200000
                  messageType:
                    type: string
                    description: Tipo da mensagem
                    example: text
                  status:
                    type: string
                    description: Status da mensagem
                    example: Pending
                  owner:
                    type: string
                    description: Proprietário da instância
                    example: '5511999999999'
        '400':
          description: Dados inválidos na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid payload
        '401':
          description: Sem sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '404':
          description: Mensagem não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message not found
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Error fetching message from database
  /message/pin:
    post:
      operationId: pinMessage
      tags:
        - Ações na mensagem e Buscar
      summary: Fixa ou desafixa uma mensagem
      description: |
        Fixa ou desafixa uma mensagem específica usando a funcionalidade nativa do WhatsApp.

        Use esta operação para destacar uma mensagem importante em uma conversa
        individual ou grupo. A resposta registra a ação e ela também aparece nos
        eventos configurados.

        **Importante**:
        - O ID pode ser fornecido no formato completo retornado pela API ou apenas como `messageid`
        - Em conversas `1:1`, a ação é suportada normalmente
        - Em grupos, a permissão depende da configuração do WhatsApp do grupo (`apenas admins` ou `qualquer membro`)
        - Em grupos, a permissão final depende das configurações do próprio grupo
        - Newsletters/canais não são suportados neste endpoint
        - Se `pin` não for enviado, o valor padrão é `true`
        - Ao fixar mensagem, `duration` aceita dias (`1`, `7` ou `30`)
        - Se `duration` não for enviado ou vier com qualquer outro valor, a API usa `30` dias
        - Ao desafixar (`pin: false`), `duration` é ignorado
      security:
        - token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: ID completo retornado pela API ou apenas o `messageid`
                  example: 3A12345678901234567890123456789012
                pin:
                  type: boolean
                  default: true
                  description: Define se a mensagem deve ser fixada (`true`) ou desafixada (`false`)
                  example: true
                duration:
                  type: integer
                  default: 30
                  description: 'Duração do pin em dias. Valores aceitos: `1`, `7` ou `30`. Qualquer outro valor cai para `30`.'
                  example: 7
            examples:
              pinMessage:
                summary: Fixar mensagem
                value:
                  id: 3A12345678901234567890123456789012
                  pin: true
                  duration: 7
              pinMessageFallback30Days:
                summary: Fixar mensagem com fallback para 30 dias
                value:
                  id: 3A12345678901234567890123456789012
                  pin: true
                  duration: 99
              unpinMessage:
                summary: Desafixar mensagem
                value:
                  id: 3A12345678901234567890123456789012
                  pin: false
      responses:
        '200':
          description: Ação de fixar/desafixar mensagem enviada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID único da mensagem gerada para o evento de pin/unpin
                    example: 5511999999999:3A12345678901234567890123456789012
                  messageid:
                    type: string
                    description: ID da mensagem do evento no WhatsApp
                    example: 3A12345678901234567890123456789012
                  chatid:
                    type: string
                    description: Chat onde a ação ocorreu
                    example: 120363123456789012@g.us
                  sender:
                    type: string
                    description: JID do remetente da ação
                    example: 5511999999999@s.whatsapp.net
                  senderName:
                    type: string
                    description: Nome do perfil da instância
                    example: Minha Instância
                  isGroup:
                    type: boolean
                    description: Indica se o chat é um grupo
                    example: true
                  fromMe:
                    type: boolean
                    description: Indica se a ação foi enviada pela própria instância
                    example: true
                  content:
                    type: object
                    description: Payload interno de `PinInChatMessage`
                  messageType:
                    type: string
                    description: Tipo da mensagem retornada
                    example: PinInChatMessage
                  source:
                    type: string
                    description: Origem estimada da mensagem
                    example: web
                  messageTimestamp:
                    type: integer
                    description: Timestamp da mensagem em milissegundos
                    example: 1704067200000
                  status:
                    type: string
                    description: Status atual da ação
                    example: Pending
                  text:
                    type: string
                    description: Texto amigável derivado da ação
                    example: Mensagem fixada
                  quoted:
                    type: string
                    description: ID da mensagem citada, quando aplicável
                    example: ''
                  edited:
                    type: string
                    description: ID da mensagem editada, quando aplicável
                    example: ''
                  reaction:
                    type: string
                    description: Emoji de reação, quando aplicável
                    example: ''
                  convertOptions:
                    type: string
                    description: Opções convertidas para mensagens interativas, quando aplicável
                    example: ''
                  owner:
                    type: string
                    description: Proprietário da instância
                    example: '5511999999999'
                  targetMessageID:
                    type: string
                    description: ID da mensagem alvo que foi fixada ou desafixada
                    example: 3EB0538DA65A59F6D8A251
                  pinned:
                    type: boolean
                    description: Estado final solicitado para a mensagem alvo
                    example: true
        '400':
          description: Dados inválidos na requisição ou operação não suportada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: message pinning is not supported for newsletters
        '401':
          description: Sem sessão ativa ou token inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No session
        '404':
          description: Mensagem não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message not found
        '500':
          description: Erro interno do servidor ou erro retornado pelo WhatsApp
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'error pinning message: ...'
  /group/create:
    post:
      operationId: createGroup
      tags:
        - Grupos e Comunidades
      summary: Criar um novo grupo
      description: >
        Cria um grupo com participantes iniciais opcionais. O WhatsApp inclui o criador automaticamente.


        Envie `participants: []`, omita o campo ou use `null` para criar um grupo somente com o criador. Informar apenas
        o próprio PN/LID tem o mesmo efeito; não é necessário adicionar o criador manualmente.


        Para convidar outras pessoas, informe números com DDI (apenas dígitos) ou JIDs PN completos, como
        `5511999999999@s.whatsapp.net`. JIDs LID conhecidos pela instância também são aceitos. Participantes são
        verificados e duplicatas/aliases do criador são removidos. Uma lista com convidados inválidos e nenhum convidado
        válido continua retornando 400; ela não é convertida silenciosamente em grupo vazio.


        A resposta contém `group` e `failed`. Depois da criação, o administrador pode obter o convite em `GET
        /group/invitelink/{groupJID}`, usando `group.JID`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome do grupo
                  minLength: 1
                  maxLength: 100
                  example: uazapiGO grupo
                participants:
                  description: >-
                    Convidados iniciais opcionais. Vazio, omitido ou null cria o grupo somente com o criador, incluído
                    automaticamente pelo WhatsApp.
                  oneOf:
                    - type: array
                      items:
                        type: string
                        description: Número com DDI, JID PN completo ou LID conhecido pela instância.
                      minItems: 0
                      example:
                        - '5521987905995'
                        - '5511912345678'
                    - type: 'null'
              required:
                - name
            examples:
              default:
                value:
                  name: Meu Novo Grupo
                  participants:
                    - '5521987905995'
              multiple_participants:
                value:
                  name: Equipe de Projeto
                  participants:
                    - '5521987905995'
                    - '5511912345678'
                    - '5519987654321'
              only_creator:
                summary: Grupo somente com o criador, para entrada posterior por convite
                value:
                  name: Nome do grupo
                  participants: []
      responses:
        '200':
          description: Grupo criado com sucesso
          content:
            application/json:
              schema:
                type: object
                required:
                  - group
                  - failed
                properties:
                  group:
                    $ref: '#/components/schemas/Group'
                  failed:
                    type: array
                    description: JIDs dos convidados que falharam na validação ou inclusão. Vazio quando não houve falhas.
                    items:
                      type: string
        '400':
          description: >-
            Payload inválido ou lista de convidados sem nenhum participante válido. Lista vazia ou somente com o criador
            é aceita.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: no valid WhatsApp participants
                  failed:
                    type: array
                    items:
                      type: string
                    description: Presente quando o erro vem da preparação dos participantes.
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to create group
      security:
        - token: []
  /group/info:
    post:
      operationId: getGroupInfo
      tags:
        - Grupos e Comunidades
      summary: Consultar detalhes e membros de um grupo
      description: >
        Use esta operação depois de selecionar um grupo na listagem. Informe apenas `groupjid` para receber dados,
        participantes conhecidos e permissões daquele grupo.


        Fotos e informações da comunidade relacionada são incluídas quando disponíveis.


        ### Opções avançadas

        - getInviteLink e getRequestsParticipants solicitam dados adicionais, somente para administrador com permissão
        confirmada. Os campos podem estar ausentes sem essa permissão.

        - force solicita atualização remota; deixe false no fluxo normal.

        - O uso normal precisa apenas de `groupjid`; adicione opções avançadas somente quando necessárias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupjid:
                  type: string
                  description: Identificador único do grupo (JID)
                  example: 120363153742561022@g.us
                getInviteLink:
                  type: boolean
                  description: >-
                    Opcional/avançado: solicita o convite, disponível somente para administrador com permissão
                    confirmada.
                  default: false
                  example: true
                getRequestsParticipants:
                  type: boolean
                  description: >-
                    Opcional/avançado: solicita pedidos de entrada, disponíveis somente para administrador com permissão
                    confirmada.
                  default: false
                  example: false
                force:
                  type: boolean
                  description: 'Avançado: solicita atualização remota. O uso normal precisa apenas de groupjid.'
                  default: false
                  example: false
              required:
                - groupjid
            example:
              groupjid: 120363153742561022@g.us
      responses:
        '200':
          description: Informações do grupo obtidas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                JID: 120363153742561022@g.us
                Name: uazapiGO Community
                Participants:
                  - JID: 5521987654321@s.whatsapp.net
                    IsAdmin: true
                IsLocked: false
                IsAnnounce: false
        '400':
          description: Payload ou groupjid inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Could not parse Group JID
        '500':
          description: Falha ao obter informações de um grupo inexistente, indisponível ou do qual a conta não participa mais.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to retrieve group information
      security:
        - token: []
  /group/inviteInfo:
    post:
      operationId: getGroupInviteInfo
      tags:
        - Grupos e Comunidades
      summary: Obter informações de um grupo pelo código de convite
      description: |
        Retorna informações detalhadas de um grupo usando um código de convite ou URL completo do WhatsApp.

        Esta rota permite:
        - Recuperar informações básicas sobre um grupo antes de entrar
        - Validar um link de convite
        - Obter detalhes como nome do grupo, número de participantes e restrições de entrada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitecode:
                  type: string
                  description: |
                    Código de convite ou URL completo do grupo.
                    Pode ser um código curto ou a URL completa do WhatsApp.
                  examples:
                    - IYnl5Zg9bUcJD32rJrDzO7
                    - https://chat.whatsapp.com/IYnl5Zg9bUcJD32rJrDzO7
              required:
                - invitecode
      responses:
        '200':
          description: Informações do grupo obtidas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                JID: 120363153742561022@g.us
                Name: uazapiGO Community
                Participants:
                  - JID: 5521987654321@s.whatsapp.net
                    IsAdmin: true
                IsLocked: false
                IsAnnounce: false
        '400':
          description: Código de convite inválido ou mal formatado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid invite code
        '404':
          description: Grupo não encontrado ou link de convite expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Group invite link is invalid or has expired
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to retrieve group information
  /group/invitelink/{groupJID}:
    get:
      operationId: getGroupInviteLink
      tags:
        - Grupos e Comunidades
      summary: Gerar link de convite para um grupo
      description: |
        Retorna o link de convite para o grupo especificado. 
        Esta operação requer que a conta conectada seja administradora do grupo.
      security:
