  call:
    post:
      summary: Chamadas
      description: >-
        Acompanhe sinalização de chamadas e registros de chamadas de saída concluídas.


        ## Duas formas de evento


        | `type` | O que representa | Onde correlacionar |

        |---|---|---|

        | `Call` | Sinalização ao vivo: oferta, aceite, encerramento, rejeição ou aviso | `event.CallID` e, quando
        disponível, `event.Data.Tag` |

        | `CallLog` | Registro de chamada de saída concluída, recebido pelo fluxo de sincronização | `event.callID` e
        `event.callResult` |


        Os subtipos incluem oferta, aceite, encerramento, rejeição, avisos de chamada e sinalização de latência,
        conforme os dados recebidos. Avisos de latência podem ser suprimidos quando já houve notificação para a chamada.
        Não espere uma sequência fixa nem um evento para cada transição interna.


        ## Como interpretar


        - `EventType` é sempre `call`; `type` diferencia `Call` e `CallLog`.

        - No fluxo ao vivo, o subtipo pode estar em `event.Data.Tag`. O campo `Reason` aparece em encerramentos quando
        fornecido.

        - `fromMe` descreve a origem. `wasSentByAPI` aparece no fluxo ao vivo quando a API consegue classificar essa
        origem.

        - Identidades PN/LID podem ser acrescentadas quando resolvidas. Em chamadas de grupo, também pode haver
        `chatid`/`chatlid` na raiz.


        ## Como processar


        Correlacione a chamada pelo ID dentro da instância, mas não deduplique apenas pelo ID: oferta e encerramento da
        mesma chamada são eventos diferentes. Não interprete `CallLog` como uma nova chamada recebida. Estes eventos não
        contêm o áudio da ligação.


        Os exemplos abaixo incluem sinalização ao vivo e um registro concluído. Campos remotos opcionais variam entre
        clientes e situações.


        ## Resultados em CallLog


        O registro usa códigos numéricos: `0` conectado, `1` rejeitado, `2` cancelado, `3` aceito em outro dispositivo,
        `4` perdido, `5` inválido, `6` indisponível, `8` falha e `9` abandonado. Registros ainda em andamento ou futuros
        não são emitidos por esse fluxo de conclusão.



        Quando disponível, `callState` informa offered, accepted, terminated ou rejected para o evento ao vivo.
      x-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEvent'
                - type: object
                  properties:
                    EventType:
                      type: string
                      const: call
                      description: Nome exato para inscrição e identificação deste evento.
                    type:
                      type: string
                      enum:
                        - Call
                        - CallLog
                      description: Call para sinalização ao vivo; CallLog para registro de chamada de saída concluída.
                    fromMe:
                      type: boolean
                      description: Chamada originada pela conta conectada.
                    wasSentByAPI:
                      type: boolean
                      description: Indica início pela API quando informado no fluxo ao vivo.
                    isGroup:
                      type: boolean
                      description: Presente em CallLog; no fluxo ao vivo também consulte event.GroupJID.
                    chatid:
                      type: string
                      description: JID da conversa, quando resolvido.
                    chatlid:
                      type:
                        - string
                        - 'null'
                      description: LID da conversa; pode ser ausente ou null.
                    sender_pn:
                      type:
                        - string
                        - 'null'
                      description: JID por telefone, quando conhecido.
                    sender_lid:
                      type:
                        - string
                        - 'null'
                      description: Identificador LID, quando conhecido.
                    event:
                      type: object
                      description: Dados da sinalização ou do registro. O formato depende de type.
                      properties:
                        CallID:
                          type: string
                          description: Identificador da chamada ao vivo. Use com o subtipo; uma chamada gera várias notificações.
                        From:
                          type: string
                          description: JID de quem enviou a sinalização.
                        CallCreator:
                          type: string
                          description: JID de quem criou a chamada.
                        CallCreatorAlt:
                          type: string
                          description: Identidade alternativa, quando disponível.
                        GroupJID:
                          type: string
                          description: JID do grupo quando aplicável; pode estar vazio.
                        Timestamp:
                          type: string
                          description: Data/hora da sinalização ao vivo em formato textual.
                        RemotePlatform:
                          type: string
                          description: Plataforma remota, quando disponível.
                        RemoteVersion:
                          type: string
                          description: Versão do cliente remoto, quando disponível.
                        Reason:
                          type: string
                          description: Motivo informado no encerramento, quando presente.
                        Data:
                          type:
                            - object
                            - 'null'
                          description: Nó de sinalização; pode não estar presente em todas as variantes.
                          properties:
                            Tag:
                              type: string
                              description: Subtipo recebido, como offer, accept, terminate ou reject.
                            Attrs:
                              description: Atributos do nó; formato variável.
                            Content:
                              description: Conteúdo adicional do nó; formato variável.
                          additionalProperties: true
                        callID:
                          type: string
                          description: ID no registro CallLog (grafia diferente de CallID).
                        callResult:
                          type: integer
                          description: Resultado numérico do registro CallLog. Não confundir com um status HTTP.
                        Media:
